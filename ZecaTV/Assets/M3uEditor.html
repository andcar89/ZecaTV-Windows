  function renderResizeCard(item) {
    let previewInner;
    if (item.status === "loading") {
      previewInner = `<div class="rz-spin"></div>`;
    } else if (item.status === "error") {
      previewInner = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--danger-icon)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
    } else {
      previewInner = `<img src="${item.previewUrl}" alt="" />`;
    }
    const meta = item.status === "ready" && item.blobSize != null
      ? `<div class="rz-card-meta"><span>${formatBytes(item.originalSize)}</span><span class="down">→ ${formatBytes(item.blobSize)}</span></div>`
      : item.status === "error"
      ? `<div class="rz-card-meta"><span style="color:var(--error-text)">${escapeHtml(t("rz.couldntLoad"))}</span></div>`
      : `<div class="rz-card-meta"><span>${escapeHtml(t("rz.processing"))}</span></div>`;
    return `<div class="rz-card">
      <div class="rz-card-preview">${previewInner}</div>
      <div class="rz-card-name mono" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
      ${meta}
      <div class="rz-card-actions">
        <button class="rz-card-btn" data-rz-action="download" data-id="${item.id}" ${item.status !== "ready" ? "disabled" : ""}>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          ${escapeHtml(t("rz.save"))}
        </button>
        <button class="rz-card-btn danger" data-rz-action="remove" data-id="${item.id}" title="Remove">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>`;
  }

  function renderResizeModal() {
    const root = document.getElementById("resizeModalRoot");
    if (!resizeModalOpen) { root.innerHTML = ""; return; }
    const prevBody = root.querySelector(".modal-body");
    const prevScrollTop = prevBody ? prevBody.scrollTop : 0;

    const hasItems = resizeItems.length > 0;
    const readyCount = resizeItems.filter((i) => i.status === "ready" && i.blob).length;
    const scopeChannels = selected.size > 0 ? channels.filter((c) => selected.has(c.id)) : getFiltered();
    const withLogoCount = scopeChannels.filter((c) => c.attrs["tvg-logo"]).length;

    const body = hasItems
      ? `<div class="rz-grid">${resizeItems.map(renderResizeCard).join("")}</div>`
      : `<div class="rz-drop-zone" id="rzDropZone">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--icon-muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 16l5-5 4 4 5-5 4 4"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
          <div class="rz-drop-zone-title">${escapeHtml(t("rz.dropTitle"))}</div>
          <div class="rz-drop-zone-sub">${escapeHtml(t("rz.dropSub"))}</div>
        </div>`;

    root.innerHTML = `
      <div class="modal-overlay" id="resizeModalOverlay">
        <div class="modal-box modal-box-lg">
          <div class="modal-header">
            <div>
              <div class="modal-title">${escapeHtml(t("rz.title"))}</div>
              <div class="modal-subtitle">${escapeHtml(t("rz.subtitle"))}</div>
            </div>
            <button class="icon-btn" id="btnCloseResizeModal" title="Close">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="modal-body">
            <div class="rz-toprow">
              <div class="form-field" style="flex:0 0 auto;">
                <span class="form-field-label">${escapeHtml(t("rz.sizeLabel"))}</span>
                <select class="form-input" id="rzSize" style="min-width:110px;">
                  <option value="256" ${resizeSize === 256 ? "selected" : ""}>256 × 256</option>
                  <option value="512" ${resizeSize === 512 ? "selected" : ""}>512 × 512</option>
                  <option value="1024" ${resizeSize === 1024 ? "selected" : ""}>1024 × 1024</option>
                </select>
              </div>
              <div class="form-field" style="flex:0 0 auto;">
                <span class="form-field-label">${escapeHtml(t("rz.paddingLabel"))}</span>
                <select class="form-input" id="rzPadding" style="min-width:90px;">
                  <option value="0" ${resizePadding === 0 ? "selected" : ""}>${escapeHtml(t("rz.paddingNone"))}</option>
                  <option value="10" ${resizePadding === 10 ? "selected" : ""}>10%</option>
                  <option value="15" ${resizePadding === 15 ? "selected" : ""}>15%</option>
                  <option value="20" ${resizePadding === 20 ? "selected" : ""}>20%</option>
                  <option value="25" ${resizePadding === 25 ? "selected" : ""}>25%</option>
                </select>
              </div>
              <div class="form-field" style="flex:0 0 auto;">
                <span class="form-field-label">${escapeHtml(t("rz.backgroundLabel"))}</span>
                <div style="display:flex; gap:6px; align-items:center;">
                  <select class="form-input" id="rzBackground" style="min-width:130px;">
                    ${RZ_BG_PRESETS.map((p) => `<option value="${p.value}" ${resizeBackground === p.value ? "selected" : ""}>${escapeHtml(t(p.labelKey))}</option>`).join("")}
                    <option value="custom" ${RZ_BG_PRESETS.some((p) => p.value === resizeBackground) ? "" : "selected"}>${escapeHtml(t("rz.bgCustom"))}</option>
                  </select>
                  <input type="color" id="rzBackgroundCustom" value="${RZ_BG_PRESETS.some((p) => p.value === resizeBackground) ? resizeBackgroundCustom : resizeBackground}" title="Pick a custom background color" style="width:32px; height:32px; padding:2px; border-radius:6px; border:1px solid var(--border-1); background:var(--bg-input); cursor:pointer; ${RZ_BG_PRESETS.some((p) => p.value === resizeBackground) ? "display:none;" : ""}" />
                </div>
              </div>
              <div class="form-field" style="flex:0 0 auto;">
                <span class="form-field-label">${escapeHtml(t("rz.formatLabel"))}</span>
                <select class="form-input" id="rzFormat" style="min-width:90px;">
                  <option value="png" ${resizeFormat === "png" ? "selected" : ""}>PNG</option>
                  <option value="webp" ${resizeFormat === "webp" ? "selected" : ""}>WebP</option>
                </select>
              </div>
            </div>
            <div class="rz-toprow">
              <button class="btn-ghost-small" id="btnRzAdd">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                ${escapeHtml(t("rz.addImages"))}
              </button>
              <input type="file" id="rzFileInput" accept="image/*" multiple style="display:none" />
              <button class="btn-ghost-small" id="btnRzPull">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                ${escapeHtml(t("rz.pullFromPlaylist").replace("{count}", withLogoCount))}
              </button>
              <div style="flex:1"></div>
              ${hasItems ? `<button class="btn-ghost-small" id="btnRzClear">${escapeHtml(t("rz.clearAll"))}</button>` : ""}
            </div>
            <div class="modal-hint">${escapeHtml(t("rz.hint").replace("{scope}", selected.size > 0 ? t("rz.scopeSelected") : t("rz.scopeShown")))}</div>
            ${body}
          </div>
          <div class="modal-footer">
            <button class="btn-ghost-small" id="btnCloseResizeModal2">${escapeHtml(t("rz.close"))}</button>
            <button class="btn-primary" id="btnRzDownloadZip" style="padding:8px 14px;" ${readyCount === 0 ? "disabled" : ""}>${escapeHtml(t("rz.downloadZip").replace("{count}", readyCount))}</button>
          </div>
        </div>
      </div>
    `;

    attachResizeModalHandlers();
    const newBody = root.querySelector(".modal-body");
    if (newBody) newBody.scrollTop = prevScrollTop;
  }

  function attachResizeModalHandlers() {
    const overlay = document.getElementById("resizeModalOverlay");
    if (!overlay) return;
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeResizeModal(); });
    document.getElementById("btnCloseResizeModal").addEventListener("click", closeResizeModal);
    document.getElementById("btnCloseResizeModal2").addEventListener("click", closeResizeModal);

    document.getElementById("rzSize").addEventListener("change", (e) => { resizeSize = parseInt(e.target.value, 10); reprocessAllResizeItems(); saveSettings(); });
    document.getElementById("rzPadding").addEventListener("change", (e) => { resizePadding = parseInt(e.target.value, 10); reprocessAllResizeItems(); saveSettings(); });
    document.getElementById("rzBackground").addEventListener("change", (e) => {
      const goingCustom = e.target.value === "custom";
      resizeBackground = goingCustom ? resizeBackgroundCustom : e.target.value;
      renderResizeModal();
      reprocessAllResizeItems();
      saveSettings();
      if (goingCustom) {
        const picker = document.getElementById("rzBackgroundCustom");
        if (picker && typeof picker.showPicker === "function") {
          try { picker.showPicker(); } catch (err) { /* older browsers: user can still click the swatch */ }
        }
      }
    });
    const customColorInput = document.getElementById("rzBackgroundCustom");
    if (customColorInput) {
      customColorInput.addEventListener("input", (e) => {
        resizeBackgroundCustom = e.target.value;
        resizeBackground = e.target.value;
        reprocessAllResizeItems();
      });
      customColorInput.addEventListener("change", saveSettings);
    }
    document.getElementById("rzFormat").addEventListener("change", (e) => { resizeFormat = e.target.value; reprocessAllResizeItems(); saveSettings(); });

    document.getElementById("btnRzAdd").addEventListener("click", () => document.getElementById("rzFileInput").click());
    document.getElementById("rzFileInput").addEventListener("change", (e) => {
      if (e.target.files.length) addResizeFiles(e.target.files);
      e.target.value = "";
    });
    document.getElementById("btnRzPull").addEventListener("click", pullLogosFromPlaylist);
    document.getElementById("btnRzDownloadZip").addEventListener("click", downloadAllResizeZip);
    const clearBtn = document.getElementById("btnRzClear");
    if (clearBtn) clearBtn.addEventListener("click", clearAllResizeItems);

    document.querySelectorAll('[data-rz-action="download"]').forEach((btn) => {
      btn.addEventListener("click", () => {
        const item = resizeItems.find((i) => i.id === btn.dataset.id);
        if (item) downloadResizeItem(item);
      });
    });
    document.querySelectorAll('[data-rz-action="remove"]').forEach((btn) => {
      btn.addEventListener("click", () => removeResizeItem(btn.dataset.id));
    });

    const dropZone = document.getElementById("rzDropZone");
    if (dropZone) {
      ["dragenter", "dragover"].forEach((evt) => {
        dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
      });
      ["dragleave", "drop"].forEach((evt) => {
        dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove("dragover"); });
      });
      dropZone.addEventListener("drop", (e) => {
        if (e.dataTransfer.files.length) addResizeFiles(e.dataTransfer.files);
      });
    }
  }

  // ---------- help modal ----------
  const HELP_SECTIONS = [
    "loading", "editing", "groups", "logos", "epg", "resize", "export", "memory", "theme",
  ];

  function openHelpModal() {
    helpModalOpen = true;
    renderHelpModal();
  }

  function closeHelpModal() {
    helpModalOpen = false;
    renderHelpModal();
  }

  function renderHelpModal() {
    const root = document.getElementById("helpModalRoot");
    if (!helpModalOpen) { root.innerHTML = ""; return; }
    const prevBody = root.querySelector(".modal-body");
    const prevScrollTop = prevBody ? prevBody.scrollTop : 0;

    const sectionsHtml = HELP_SECTIONS.map((key) => `
      <div style="margin-bottom:16px;">
        <div style="font-size:12.5px; font-weight:700; color:var(--text-0); margin-bottom:4px;">${escapeHtml(t(`help.s.${key}.title`))}</div>
        <div style="font-size:12px; color:var(--text-3); line-height:1.6;">${escapeHtml(t(`help.s.${key}.body`))}</div>
      </div>`).join("");

    root.innerHTML = `
      <div class="modal-overlay" id="helpModalOverlay">
        <div class="modal-box modal-box-lg">
          <div class="modal-header">
            <div>
              <div class="modal-title">${escapeHtml(t("help.title"))}</div>
              <div class="modal-subtitle">${escapeHtml(t("help.subtitle"))}</div>
            </div>
            <button class="icon-btn" id="btnCloseHelpModal" title="Close">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="modal-body">${sectionsHtml}</div>
          <div class="modal-footer">
            <button class="btn-primary" id="btnCloseHelpModal2" style="padding:8px 14px;">${escapeHtml(t("help.close"))}</button>
          </div>
        </div>
      </div>
    `;

    attachHelpModalHandlers();
    const newBody = root.querySelector(".modal-body");
    if (newBody) newBody.scrollTop = prevScrollTop;
  }

  function attachHelpModalHandlers() {
    const overlay = document.getElementById("helpModalOverlay");
    if (!overlay) return;
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeHelpModal(); });
    document.getElementById("btnCloseHelpModal").addEventListener("click", closeHelpModal);
    document.getElementById("btnCloseHelpModal2").addEventListener("click", closeHelpModal);
  }

  // ---------- wire up static controls ----------
  document.getElementById("btnLoad").addEventListener("click", () => document.getElementById("fileInput").click());
  document.getElementById("fileInput").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) handleFile(f);
    e.target.value = "";
  });
  document.getElementById("btnExport").addEventListener("click", handleExport);
  document.getElementById("searchInput").addEventListener("input", (e) => { search = e.target.value; render(); });
  document.getElementById("btnClean").addEventListener("click", applyCleanupPass);
  document.getElementById("btnSelectAll").addEventListener("click", () => {
    selected = new Set(getFiltered().map((c) => c.id));
    render();
  });
  document.getElementById("btnClearSel").addEventListener("click", () => { selected = new Set(); render(); });
  document.getElementById("btnDeleteSel").addEventListener("click", deleteSelected);
  document.getElementById("btnReplace").addEventListener("click", applyBulkFindReplace);
  document.getElementById("btnAssignGroup").addEventListener("click", applyBulkGroup);
  document.getElementById("btnForceHttp").addEventListener("click", () => applyForceUrlScheme("http"));
  document.getElementById("btnForceHttps").addEventListener("click", () => applyForceUrlScheme("https"));
  document.getElementById("btnOpenLogoModal").addEventListener("click", openLogoModal);
  document.getElementById("btnOpenLoadModal").addEventListener("click", openLoadModal);
  document.getElementById("btnOpenEpgModal").addEventListener("click", openEpgModal);
  document.getElementById("epgChip").addEventListener("click", openEpgModal);
  document.getElementById("btnOpenResizeModal").addEventListener("click", openResizeModal);

  function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarBackdrop").classList.add("show");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarBackdrop").classList.remove("show");
  }
  document.getElementById("btnSidebarToggle").addEventListener("click", openSidebar);
  document.getElementById("sidebarBackdrop").addEventListener("click", closeSidebar);

  // ---------- hover-to-zoom logo preview ----------
  document.addEventListener("mouseover", (e) => {
    const thumb = e.target.closest(".match-thumb");
    if (!thumb) return;
    const img = thumb.querySelector("img");
    if (!img || !img.getAttribute("src")) return;
    const preview = document.getElementById("hoverPreview");
    const previewImg = document.getElementById("hoverPreviewImg");
    previewImg.src = img.src;
    const rect = thumb.getBoundingClientRect();
    const boxSize = 216;
    let left = rect.right + 10;
    if (left + boxSize > window.innerWidth) left = Math.max(10, rect.left - boxSize - 10);
    let top = rect.top - boxSize / 2 + rect.height / 2;
    top = Math.max(10, Math.min(top, window.innerHeight - boxSize - 10));
    preview.style.left = `${left}px`;
    preview.style.top = `${top}px`;
    preview.classList.add("show");
  });
  document.addEventListener("mouseout", (e) => {
    if (e.target.closest(".match-thumb")) {
      document.getElementById("hoverPreview").classList.remove("show");
    }
  });

  // ---------- keyboard shortcuts ----------
  document.addEventListener("keydown", (e) => {
    const tag = (e.target.tagName || "").toLowerCase();
    const inTextField = tag === "input" || tag === "textarea" || e.target.isContentEditable;

    if (e.key === "Escape") {
      if (helpModalOpen) { closeHelpModal(); return; }
      if (logoModalOpen) { closeLogoModal(); return; }
      if (loadModalOpen) { closeLoadModal(); return; }
      if (epgModalOpen) { closeEpgModal(); return; }
      if (resizeModalOpen) { closeResizeModal(); return; }
      if (selected.size > 0) { selected = new Set(); render(); }
      if (inTextField) e.target.blur();
      return;
    }

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a" && !inTextField) {
      e.preventDefault();
      selected = new Set(getFiltered().map((c) => c.id));
      render();
    }
  });

  // ---------- remembered settings, per playlist (this browser only, via localStorage) ----------
  // Saves the fiddly-to-retype fields (GitHub logo folder, Xtream portal details,
  // last playlist URL, resize defaults) keyed by the playlist's own filename, so
  // switching between different providers' playlists doesn't mix up their
  // settings — each file gets its own remembered set, and reloading a file you
  // exported from here (name-edited.m3u) still matches back to the original.
  const FILE_SETTINGS_KEY = "m3uEditorSettingsByFile.v1";
  let allFileSettings = {}; // canonicalKey -> snapshot
  const DEFAULT_FILE_SETTINGS = {
    logoUrlValue: "", loadUrlValue: "", xtreamServer: "", xtreamUsername: "", xtreamPassword: "",
    xtreamOutput: "ts", xtreamFetchEpg: true, resizeSize: 512, resizePadding: 15,
    resizeBackground: "transparent", resizeBackgroundCustom: "#4a4a5a", resizeFormat: "png",
  };

  function settingsKeyForFile(name) {
    let base = (name || "").trim().replace(/\.(m3u8?|txt)$/i, "");
    while (/-edited$/i.test(base)) base = base.replace(/-edited$/i, "");
    return base.toLowerCase() || "untitled";
  }

  function loadAllFileSettings() {
    try {
      const raw = localStorage.getItem(FILE_SETTINGS_KEY);
      allFileSettings = raw ? JSON.parse(raw) : {};
    } catch (err) { allFileSettings = {}; }
  }

  function applySettingsSnapshot(s) {
    logoUrlValue = typeof s.logoUrlValue === "string" ? s.logoUrlValue : "";
    loadUrlValue = typeof s.loadUrlValue === "string" ? s.loadUrlValue : "";
    xtreamServer = typeof s.xtreamServer === "string" ? s.xtreamServer : "";
    xtreamUsername = typeof s.xtreamUsername === "string" ? s.xtreamUsername : "";
    xtreamPassword = typeof s.xtreamPassword === "string" ? s.xtreamPassword : "";
    xtreamOutput = typeof s.xtreamOutput === "string" ? s.xtreamOutput : "ts";
    xtreamFetchEpg = typeof s.xtreamFetchEpg === "boolean" ? s.xtreamFetchEpg : true;
    resizeSize = typeof s.resizeSize === "number" ? s.resizeSize : 512;
    resizePadding = typeof s.resizePadding === "number" ? s.resizePadding : 15;
    resizeBackground = typeof s.resizeBackground === "string" ? s.resizeBackground : "transparent";
    resizeBackgroundCustom = typeof s.resizeBackgroundCustom === "string" ? s.resizeBackgroundCustom : "#4a4a5a";
    resizeFormat = typeof s.resizeFormat === "string" ? s.resizeFormat : "png";
  }

  // Called whenever a playlist finishes loading — swaps in that file's own
  // remembered settings, or blanks everything back to defaults if this file
  // has none saved yet (so a previous file's Xtream login etc. never leaks in).
  function loadSettingsForCurrentFile() {
    const key = settingsKeyForFile(fileName);
    applySettingsSnapshot(allFileSettings[key] || DEFAULT_FILE_SETTINGS);
  }

  function saveSettings(labelOverride) {
    try {
      const key = settingsKeyForFile(labelOverride !== undefined ? labelOverride : fileName);
      allFileSettings[key] = {
        logoUrlValue, loadUrlValue, xtreamServer, xtreamUsername, xtreamPassword,
        xtreamOutput, xtreamFetchEpg, resizeSize, resizePadding, resizeBackground,
        resizeBackgroundCustom, resizeFormat,
      };
      localStorage.setItem(FILE_SETTINGS_KEY, JSON.stringify(allFileSettings));
    } catch (err) { /* localStorage unavailable (private browsing, etc.) — not critical */ }
  }

  // ---------- theme (light/dark) ----------
  // A page-wide display preference, not tied to any one playlist, so it's kept
  // in its own localStorage key (unlike the per-file settings above).
  const THEME_KEY = "m3uEditorTheme.v1";
  let theme = "dark";
  function loadTheme() {
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") theme = saved;
    } catch (err) { /* ignore */ }
  }
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    const moon = document.getElementById("themeIconMoon");
    const sun = document.getElementById("themeIconSun");
    const btn = document.getElementById("btnToggleTheme");
    if (moon && sun) {
      moon.style.display = theme === "dark" ? "" : "none";
      sun.style.display = theme === "light" ? "" : "none";
    }
    if (btn) btn.title = theme === "dark" ? t("theme.toLight") : t("theme.toDark");
  }
  function toggleTheme() {
    theme = theme === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, theme); } catch (err) { /* ignore */ }
    applyTheme();
  }

  // ---------- language (EN/PT) ----------
  const LANG_KEY = "m3uEditorLang.v1";
  let lang = "en";
  function loadLang() {
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "pt") lang = saved;
    } catch (err) { /* ignore */ }
  }
  function t(key) {
    const dict = I18N[lang] || I18N.en;
    return (key in dict) ? dict[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  }
  function applyI18n() {
    document.title = t("app.docTitle");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.getAttribute("data-i18n-placeholder")); });
    document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.getAttribute("data-i18n-title")); });
    const langLabel = document.getElementById("langBtnLabel");
    if (langLabel) langLabel.textContent = lang === "en" ? "PT" : "EN";
    applyTheme(); // refreshes the theme button's tooltip in the new language
  }
  function toggleLang() {
    lang = lang === "en" ? "pt" : "en";
    try { localStorage.setItem(LANG_KEY, lang); } catch (err) { /* ignore */ }
    applyI18n();
    render();
    if (logoModalOpen) renderLogoModal();
    if (loadModalOpen) renderLoadModal();
    if (epgModalOpen) renderEpgModal();
    if (resizeModalOpen) renderResizeModal();
    if (helpModalOpen) renderHelpModal();
  }

  document.getElementById("btnToggleTheme").addEventListener("click", toggleTheme);
  document.getElementById("btnToggleLang").addEventListener("click", toggleLang);
  document.getElementById("btnOpenHelpModal").addEventListener("click", openHelpModal);

  // ---------- init ----------
  loadTheme();
  applyTheme();
  loadLang();
  applyI18n();
  loadAllFileSettings();
  loadSettingsForCurrentFile();
  channels = parseM3U(SAMPLE).channels;
  render();
})();
</script>
