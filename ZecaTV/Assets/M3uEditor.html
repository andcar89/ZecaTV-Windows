  // ---------- parsing ----------
  function findNameCommaIndex(meta) {
    let inQuotes = false, lastComma = -1;
    for (let i = 0; i < meta.length; i++) {
      const c = meta[i];
      if (c === '"') inQuotes = !inQuotes;
      if (c === "," && !inQuotes) lastComma = i;
    }
    return lastComma;
  }

  function parseExtinf(line) {
    const body = line.slice("#EXTINF:".length);
    const commaIdx = findNameCommaIndex(body);
    const meta = commaIdx >= 0 ? body.slice(0, commaIdx) : body;
    const name = commaIdx >= 0 ? body.slice(commaIdx + 1).trim() : "";
    const durMatch = meta.match(/^\s*(-?\d+(\.\d+)?)/);
    const duration = durMatch ? durMatch[1] : "-1";
    const attrs = {};
    const attrRegex = /([a-zA-Z0-9_-]+)="([^"]*)"/g;
    let m;
    while ((m = attrRegex.exec(meta)) !== null) attrs[m[1]] = m[2];
    return { duration, attrs, name };
  }

  function parseM3U(text) {
    const lines = text.replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let pendingExtinf = null, pendingExtra = [];
    let epgUrl = "";
    for (let raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      if (line.startsWith("#EXTM3U")) {
        const m = line.match(/(?:url-tvg|x-tvg-url)="([^"]+)"/i);
        if (m) epgUrl = m[1];
        continue;
      }
      if (line.startsWith("#EXTINF")) { pendingExtinf = line; pendingExtra = []; continue; }
      if (line.startsWith("#")) { if (pendingExtinf) pendingExtra.push(line); continue; }
      if (pendingExtinf) {
        const parsed = parseExtinf(pendingExtinf);
        out.push({ id: "ch" + idCounter++, duration: parsed.duration, attrs: parsed.attrs, name: parsed.name, url: line, extra: pendingExtra });
        pendingExtinf = null; pendingExtra = [];
      } else {
        out.push({ id: "ch" + idCounter++, duration: "-1", attrs: {}, name: line, url: line, extra: [] });
      }
    }
    return { channels: out, epgUrl };
  }

  function serializeM3U(chs, epgUrl) {
    const header = epgUrl ? `#EXTM3U url-tvg="${epgUrl}"` : "#EXTM3U";
    const out = [header];
    for (const ch of chs) {
      const attrStr = Object.entries(ch.attrs)
        .filter(([, v]) => v !== undefined && v !== null && v !== "")
        .map(([k, v]) => `${k}="${v}"`).join(" ");
      out.push(`#EXTINF:${ch.duration}${attrStr ? " " + attrStr : ""},${ch.name}`);
      for (const ex of ch.extra) out.push(ex);
      out.push(ch.url);
    }
    return out.join("\n") + "\n";
  }

  function groupOf(ch) {
    const g = ch.attrs["group-title"];
    return g && g.trim() ? g.trim() : "Ungrouped";
  }

  function titleCase(s) {
    const KEEP_UPPER = new Set(["HD","SD","4K","FHD","UHD","TV","PT","UK","US"]);
    return s.split(" ").map((word) => {
      if (!word) return word;
      const upper = word.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (KEEP_UPPER.has(upper)) return word.toUpperCase();
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }).join(" ");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  // ---------- logo matching engine ----------
  function stripDiacritics(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function normalizeChannelName(s) {
    let t = stripDiacritics(String(s).toLowerCase());
    t = t.replace(/\[[^\]]*\]/g, " ").replace(/\([^)]*\)/g, " ");
    t = t.replace(/\b(hd|fhd|uhd|4k|full|sd|backup|raw|vip)\b/g, " ");
    t = t.replace(/[^a-z0-9]+/g, "");
    return t;
  }

  function detectCountrySuffix(baseNames) {
    const counts = {};
    for (const b of baseNames) {
      const parts = b.split("-");
      if (parts.length < 2) continue;
      const last = parts[parts.length - 1];
      if (!last || /^\d+$/.test(last)) continue;
      counts[last] = (counts[last] || 0) + 1;
    }
    let best = null, bestCount = 0;
    for (const [k, v] of Object.entries(counts)) {
      if (v > bestCount) { bestCount = v; best = k; }
    }
    return best && bestCount >= baseNames.length * 0.5 ? best : null;
  }

  function normalizeFileName(name, suffix) {
    let t = stripDiacritics(String(name).toLowerCase().replace(/\.(png|svg|jpe?g|webp)$/i, ""));
    if (suffix) {
      const re = new RegExp("-" + suffix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "$");
      t = t.replace(re, "");
    }
    t = t.replace(/-(hd|fhd|uhd|4k|sd)$/, "");
    t = t.replace(/[^a-z0-9]+/g, "");
    return t;
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = new Array(n + 1);
    for (let j = 0; j <= n; j++) dp[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = dp[0];
      dp[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = dp[j];
        dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
        prev = tmp;
      }
    }
    return dp[n];
  }

  function matchScore(a, b) {
    if (!a || !b) return 0;
    if (a === b) return 1;
    let s = 1 - levenshtein(a, b) / Math.max(a.length, b.length);
    const shorter = Math.min(a.length, b.length);
    const longer = Math.max(a.length, b.length);
    // Containment (e.g. "rtp1" inside "rtp1pt") is a strong signal, but only when the
    // two strings are reasonably close in length — otherwise short names like "sic"
    // spuriously match as substrings of unrelated long words like "classic".
    if ((a.includes(b) || b.includes(a)) && shorter >= 3 && shorter / longer >= 0.55) {
      s = Math.max(s, 0.85);
    }
    return s;
  }

  function parseGithubTreeUrl(url) {
    try {
      const u = new URL(String(url).trim());
      if (u.hostname !== "github.com") return null;
      const parts = u.pathname.split("/").filter(Boolean);
      if (parts.length < 4 || parts[2] !== "tree") return null;
      return { owner: parts[0], repo: parts[1], branch: parts[3], path: parts.slice(4).join("/") };
    } catch (e) {
      return null;
    }
  }

  function encodePath(path) {
    return path.split("/").map(encodeURIComponent).join("/");
  }

  async function fetchLogoFolder(rawUrl) {
    const parsed = parseGithubTreeUrl(rawUrl);
    if (!parsed) {
      logoStatus = { type: "error", text: t("logo.errNotGithubFolder") };
      renderLogoModal();
      return;
    }
    logoStatus = { type: "loading", text: t("logo.fetchingListing") };
    logoFetchedFiles = [];
    logoMatchResults = [];
    renderLogoModal();

    const apiUrl = `https://api.github.com/repos/${parsed.owner}/${parsed.repo}/contents/${encodePath(parsed.path)}${parsed.branch ? "?ref=" + encodeURIComponent(parsed.branch) : ""}`;
    try {
      const res = await fetch(apiUrl, { headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) {
        if (res.status === 403) throw new Error(t("logo.rateLimit"));
        if (res.status === 404) throw new Error(t("logo.folderNotFound"));
        throw new Error(t("logo.githubError").replace("{status}", res.status));
      }
      const data = await res.json();
      const files = (Array.isArray(data) ? data : []).filter(
        (item) => item.type === "file" && /\.(png|svg|jpe?g|webp)$/i.test(item.name)
      );
      if (files.length === 0) {
        logoStatus = { type: "error", text: t("logo.noImageFiles") };
        renderLogoModal();
        return;
      }
      logoFetchedFiles = files.map((f) => ({ name: f.name, download_url: f.download_url }));
      renderLogoDatalist();
      runMatching();
    } catch (err) {
      logoStatus = { type: "error", text: friendlyFetchError(err) };
      renderLogoModal();
    }
  }

  function runMatching() {
    const scopeChannels = selected.size > 0 ? channels.filter((c) => selected.has(c.id)) : getFiltered();
    const baseNames = logoFetchedFiles.map((f) => f.name.replace(/\.(png|svg|jpe?g|webp)$/i, "").toLowerCase());
    const suffix = detectCountrySuffix(baseNames);
    const normFiles = logoFetchedFiles.map((f) => ({ ...f, norm: normalizeFileName(f.name, suffix) }));

    logoMatchResults = scopeChannels.map((ch) => {
      const normCh = normalizeChannelName(ch.name);
      let best = null, bestScore = 0;
      for (const f of normFiles) {
        const score = matchScore(normCh, f.norm);
        if (score > bestScore) { bestScore = score; best = f; }
      }
      const hasMatch = bestScore >= 0.45;
      const currentLogo = ch.attrs["tvg-logo"] || "";
      const currentLogoName = currentLogo ? currentLogo.split("/").pop().split("?")[0] : "";
      const bestFile = hasMatch ? best : null;
      // already has the exact file we'd suggest — nothing to change here
      const alreadyGood = !!(bestFile && currentLogoName && currentLogoName.toLowerCase() === bestFile.name.toLowerCase());
      return {
        channelId: ch.id,
        channelName: ch.name,
        currentLogo,
        bestFile,
        score: bestScore,
        accepted: bestScore >= 0.75 && !alreadyGood,
        alreadyGood,
      };
    });

    const matchedCount = logoMatchResults.filter((r) => r.bestFile).length;
    const needsReviewCount = logoMatchResults.filter((r) => !r.alreadyGood).length;
    logoStatus = {
      type: "success",
      text: t("logo.foundMatched")
        .replace("{files}", logoFetchedFiles.length)
        .replace("{matched}", matchedCount)
        .replace("{total}", logoMatchResults.length)
        .replace("{review}", needsReviewCount),
    };
    renderLogoModal();
  }

  function applyLogoMatches() {
    let count = 0;
    for (const r of logoMatchResults) {
      if (r.accepted && r.bestFile) {
        const ch = findChannel(r.channelId);
        if (ch) {
          ch.attrs["tvg-logo"] = r.bestFile.download_url;
          count++;
        }
      }
    }
    closeLogoModal();
    render();
    showToast(count > 0 ? t("toast.appliedLogos").replace("{count}", count) : t("toast.noLogosChecked"));
  }

  // ---------- fetching a remote playlist ----------
  // ---------- reading a fetch response as text, transparently handling gzip ----------
  function friendlyFetchError(err) {
    const msg = (err && err.message) || "";
    if (err instanceof TypeError || /NetworkError|Failed to fetch/i.test(msg)) {
      return t("fetch.corsError");
    }
    return msg || t("fetch.somethingWrong");
  }

  async function bytesToText(bytes) {
    const isGzip = bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
    if (!isGzip) {
      return new TextDecoder("utf-8").decode(bytes);
    }
    if (typeof DecompressionStream === "undefined") {
      throw new Error("That file is gzip-compressed and your browser doesn't support automatic decompression here. Try an uncompressed copy instead, or update your browser.");
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const decompressedBuf = await new Response(stream).arrayBuffer();
    return new TextDecoder("utf-8").decode(decompressedBuf);
  }

  async function readResponseText(res) {
    const buf = await res.arrayBuffer();
    return bytesToText(new Uint8Array(buf));
  }

  async function fetchPlaylistFromUrl(url, sourceLabel) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(t("fetch.serverError").replace("{status}", res.status));
    const text = await readResponseText(res);
    if (!/^\s*#EXTM3U/i.test(text)) {
      throw new Error(t("fetch.notM3u"));
    }
    const parsed = parseM3U(text);
    if (!applyLoadedPlaylist(parsed, sourceLabel)) {
      throw new Error(t("fetch.noChannelsInPlaylist"));
    }
    return parsed.channels.length;
  }

  function buildXtreamUrls({ server, username, password, output }) {
    const base = server.trim().replace(/\/+$/, "");
    const u = encodeURIComponent(username.trim());
    const p = encodeURIComponent(password.trim());
    return {
      m3uUrl: `${base}/get.php?username=${u}&password=${p}&type=m3u_plus&output=${output}`,
      epgUrl: `${base}/xmltv.php?username=${u}&password=${p}`,
    };
  }

  // renders (or re-renders in place, without redrawing the whole modal and
  // stealing input focus) the "open these links directly" fallback for when
  // the portal blocks CORS — navigating to a URL isn't subject to CORS, only fetch() is
  function renderXtreamLinksBox() {
    if (!xtreamServer.trim() || !xtreamUsername.trim() || !xtreamPassword.trim()) return "";
    const links = buildXtreamUrls({ server: xtreamServer, username: xtreamUsername, password: xtreamPassword, output: xtreamOutput });
    return `<div class="modal-status loading" style="display:flex; flex-direction:column; gap:6px;">
      <div>${escapeHtml(t("load.corsBox"))}</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <a href="${escapeHtml(links.m3uUrl)}" target="_blank" rel="noopener" class="btn-ghost-small" style="text-decoration:none;">${escapeHtml(t("load.openPlaylistLink"))}</a>
        <a href="${escapeHtml(links.epgUrl)}" target="_blank" rel="noopener" class="btn-ghost-small" style="text-decoration:none;">${escapeHtml(t("load.openEpgLink"))}</a>
      </div>
    </div>`;
  }

  function refreshXtreamLinksBox() {
    const box = document.getElementById("xtreamLinksBox");
    if (box) box.innerHTML = renderXtreamLinksBox();
  }

  // ---------- EPG (XMLTV) engine ----------
  function parseXmltvTime(s) {
    if (!s) return null;
    const m = String(s).trim().match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})(?:\s*([+-]\d{4}))?$/);
    if (!m) return null;
    const [, Y, Mo, D, H, Mi, S, tz] = m;
    let iso = `${Y}-${Mo}-${D}T${H}:${Mi}:${S}`;
    iso += tz ? tz.slice(0, 3) + ":" + tz.slice(3) : "Z";
    const d = new Date(iso);
    return isNaN(d.getTime()) ? null : d;
  }

  function tryParseXmlDoc(text) {
    const doc = new DOMParser().parseFromString(text, "application/xml");
    if (doc.querySelector("parsererror")) return null;
    return doc;
  }

  function extractXmlRegion(text) {
    // Handles a file that isn't raw XML anymore — e.g. Chrome's "Save As" on a
    // page it renders as an XML viewer defaults to "Webpage, HTML only" and
    // wraps the real XML in its own viewer markup. Pull out just the <tv>...</tv>
    // block (or from <?xml ...?>) and ignore whatever wrapper is around it.
    const startMatch = text.match(/<\?xml[^>]*\?>|<tv[\s>]/i);
    if (!startMatch) return null;
    const lastEnd = text.lastIndexOf("</tv>");
    if (lastEnd === -1) return null;
    return text.slice(startMatch.index, lastEnd + "</tv>".length);
  }

  function parseXmltv(text) {
    let doc = tryParseXmlDoc(text);
    if (!doc) {
      const extracted = extractXmlRegion(text);
      if (extracted) doc = tryParseXmlDoc(extracted);
    }
    if (!doc) throw new Error("Couldn't parse that as XML (XMLTV). If you saved this from a browser tab, try Save As → set “Save as type” to “All files” (or “Text file”) instead of “Webpage, HTML only”, so the raw XML is kept as-is.");

    const channelsMap = new Map();
    doc.querySelectorAll("channel").forEach((el) => {
      const id = el.getAttribute("id");
      if (!id) return;
      const dn = el.querySelector("display-name");
      const icon = el.querySelector("icon");
      channelsMap.set(id, {
        id,
        displayName: dn ? dn.textContent.trim() : id,
        icon: icon ? icon.getAttribute("src") || "" : "",
      });
    });

    const programmesMap = new Map();
    doc.querySelectorAll("programme").forEach((el) => {
      const channelId = el.getAttribute("channel");
      if (!channelId) return;
      const start = parseXmltvTime(el.getAttribute("start"));
      const stop = parseXmltvTime(el.getAttribute("stop"));
      const titleEl = el.querySelector("title");
      if (!programmesMap.has(channelId)) programmesMap.set(channelId, []);
      programmesMap.get(channelId).push({ start, stop, title: titleEl ? titleEl.textContent.trim() : "" });
    });
    programmesMap.forEach((list) => list.sort((a, b) => (a.start ? a.start.getTime() : 0) - (b.start ? b.start.getTime() : 0)));

    if (channelsMap.size === 0) throw new Error("No <channel> entries found in that XMLTV file.");
    return { channelsMap, programmesMap };
  }

  // Merges every loaded source's channels/programmes into the single combined
  // view the rest of the app (matching, now/next, datalist) reads from. A
  // channel id present in more than one source takes the value from whichever
  // source was added last, so newly-added sources extend coverage rather than
  // replacing it.
  function recomputeEpgCombined() {
    const combinedChannels = new Map();
    const combinedProgrammes = new Map();
    for (const src of epgSources) {
      src.channelsMap.forEach((v, k) => combinedChannels.set(k, v));
      src.programmesMap.forEach((v, k) => combinedProgrammes.set(k, v));
    }
    epgChannels = combinedChannels;
    epgProgrammesByChannel = combinedProgrammes;
    renderEpgDatalist();
  }

  // Adds a new EPG source, or — if a source with the same non-empty URL is
  // already loaded — refreshes it in place instead of duplicating it.
  function addOrUpdateEpgSource({ url, label, channelsMap, programmesMap }) {
    const cleanUrl = (url || "").trim();
    const existingIdx = cleanUrl ? epgSources.findIndex((s) => s.url === cleanUrl) : -1;
    const src = {
      id: existingIdx !== -1 ? epgSources[existingIdx].id : `epgsrc-${++epgSourceIdCounter}`,
      url: cleanUrl,
      label: label || cleanUrl || "Untitled source",
      channelsMap: channelsMap || new Map(),
      programmesMap: programmesMap || new Map(),
    };
    if (existingIdx !== -1) epgSources[existingIdx] = src;
    else epgSources.push(src);
    recomputeEpgCombined();
    return src;
  }

  function removeEpgSource(id) {
    epgSources = epgSources.filter((s) => s.id !== id);
    recomputeEpgCombined();
    runEpgMatching();
    render();
  }

  // Joins every source's URL (skipping file-loaded sources that have none)
  // into the value written as the playlist's url-tvg on export. Most players
  // (TiviMate, IPTV Smarters, etc.) accept a comma-separated list here.
  function getEpgExportUrl() {
    const urls = epgSources.map((s) => s.url).filter(Boolean);
    return Array.from(new Set(urls)).join(",");
  }

  function applyEpgXmlText(text, sourceUrlForExport, sourceLabel) {
    const { channelsMap, programmesMap } = parseXmltv(text);
    addOrUpdateEpgSource({ url: sourceUrlForExport || "", label: sourceLabel || sourceUrlForExport || "Loaded source", channelsMap, programmesMap });
    // clear the input so it's ready for adding another source
    if (sourceUrlForExport && epgUrlValue.trim() === sourceUrlForExport.trim()) epgUrlValue = "";
    let programmeCount = 0;
    programmesMap.forEach((list) => { programmeCount += list.length; });
    const totalSources = epgSources.length;
    epgStatus = { type: "success", text: t("epg.loadedSource")
      .replace("{channels}", channelsMap.size)
      .replace("{programmes}", programmeCount)
      .replace("{total}", epgChannels.size)
      .replace("{sources}", totalSources) };
    runEpgMatching();
    render();
    renderEpgModal();
  }

  async function fetchEpg(url) {
    epgStatus = { type: "loading", text: t("epg.fetchingGuide") };
    renderEpgModal();
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(t("fetch.serverError").replace("{status}", res.status));
      const text = await readResponseText(res);
      applyEpgXmlText(text, url, url);
    } catch (err) {
      epgStatus = { type: "error", text: friendlyFetchError(err) };
      renderEpgModal();
    }
  }

  function loadEpgFromFile(file) {
    epgStatus = { type: "loading", text: t("epg.readingFile").replace("{name}", file.name) };
    renderEpgModal();
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const bytes = new Uint8Array(e.target.result);
        const text = await bytesToText(bytes);
        // keep whatever URL is already in the field so export still points at the real source
        applyEpgXmlText(text, epgUrlValue.trim(), file.name);
      } catch (err) {
        epgStatus = { type: "error", text: (err && err.message) || t("epg.couldntReadFile") };
        renderEpgModal();
      }
    };
    reader.onerror = () => {
      epgStatus = { type: "error", text: t("epg.couldntReadFile") };
      renderEpgModal();
    };
    reader.readAsArrayBuffer(file);
  }

  function getNowNext(tvgId) {
    const list = epgProgrammesByChannel.get(tvgId);
    if (!list || list.length === 0) return null;
    const now = new Date();
    let current = null, next = null;
    for (let i = 0; i < list.length; i++) {
      const p = list[i];
      if (p.start && p.stop && p.start <= now && now < p.stop) { current = p; next = list[i + 1] || null; break; }
      if (p.start && p.start > now) { next = p; break; }
    }
    return { current, next };
  }

  function renderEpgDatalist() {
    const dl = document.getElementById("epgChannelDatalist");
    const options = [];
    epgChannels.forEach((e) => {
      options.push(`<option value="${escapeHtml(e.displayName)} — ${escapeHtml(e.id)}"></option>`);
    });
    dl.innerHTML = options.join("");
  }

  function renderLogoDatalist() {
    const dl = document.getElementById("logoFileDatalist");
    dl.innerHTML = logoFetchedFiles.map((f) => `<option value="${escapeHtml(f.name)}"></option>`).join("");
  }

  function runEpgMatching() {
    const scopeChannels = selected.size > 0 ? channels.filter((c) => selected.has(c.id)) : getFiltered();
    const epgList = Array.from(epgChannels.values());
    epgMatchResults = scopeChannels.map((ch) => {
      const normCh = normalizeChannelName(ch.name);
      let best = null, bestScore = 0;
      for (const e of epgList) {
        const score = matchScore(normCh, normalizeChannelName(e.displayName));
        if (score > bestScore) { bestScore = score; best = e; }
      }
      const hasMatch = bestScore >= 0.45;
      const currentTvgId = ch.attrs["tvg-id"] || "";
      const bestMatch = hasMatch ? best : null;
      // already linked to the exact channel we'd suggest — nothing to change here
      const alreadyGood = !!(bestMatch && currentTvgId && currentTvgId === bestMatch.id);
      return {
        channelId: ch.id,
        channelName: ch.name,
        currentTvgId,
        bestMatch,
        score: bestScore,
        accepted: bestScore >= 0.75 && !alreadyGood,
        alreadyGood,
      };
    });
  }

  function applyEpgMatches() {
    let count = 0;
    for (const r of epgMatchResults) {
      if (r.accepted && r.bestMatch) {
        const ch = findChannel(r.channelId);
        if (ch) {
          ch.attrs["tvg-id"] = r.bestMatch.id;
          count++;
        }
      }
    }
    closeEpgModal();
    render();
    showToast(count > 0 ? t("toast.linkedEpg").replace("{count}", count) : t("toast.noEpgChecked"));
  }

  // ---------- logo resizer engine ----------
  function addResizeFiles(fileList) {
    const files = Array.from(fileList).filter((f) => f.type.startsWith("image/") || /\.svg$/i.test(f.name));
    if (files.length === 0) return;
    for (const file of files) {
      const item = {
        id: "rz" + resizeIdCounter++,
        name: file.name,
        originalSize: file.size,
        img: null,
        status: "loading",
        blob: null,
        blobSize: null,
        previewUrl: null,
      };
      resizeItems.push(item);
      loadResizeImageFromFile(item, file);
    }
    renderResizeModal();
  }

  function loadResizeImageFromFile(item, file) {
    const img = new Image();
    img.onload = () => { item.img = img; item.status = "ready"; processResizeItem(item); };
    img.onerror = () => { item.status = "error"; renderResizeModal(); };
    img.src = URL.createObjectURL(file);
  }

  function addResizeItemFromBlob(name, blob) {
    const item = {
      id: "rz" + resizeIdCounter++,
      name,
      originalSize: blob.size,
      img: null,
      status: "loading",
      blob: null,
      blobSize: null,
      previewUrl: null,
    };
    resizeItems.push(item);
    const img = new Image();
    img.onload = () => { item.img = img; item.status = "ready"; processResizeItem(item); };
    img.onerror = () => { item.status = "error"; renderResizeModal(); };
    img.src = URL.createObjectURL(blob);
    return item;
  }

  function processResizeItem(item) {
    if (!item.img) return;
    const size = resizeSize, paddingPercent = resizePadding, background = resizeBackground, format = resizeFormat;
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    if (background !== "transparent") {
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, size, size);
    }
    const pad = size * (paddingPercent / 100);
    const maxW = size - pad * 2, maxH = size - pad * 2;
    const iw = item.img.naturalWidth || item.img.width;
    const ih = item.img.naturalHeight || item.img.height;
    const scale = Math.min(maxW / iw, maxH / ih);
    const w = iw * scale, h = ih * scale;
    const x = (size - w) / 2, y = (size - h) / 2;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(item.img, x, y, w, h);
    const mime = format === "webp" ? "image/webp" : "image/png";
    const quality = format === "webp" ? 0.92 : undefined;
    canvas.toBlob((blob) => {
      if (!blob) return;
      if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      item.blob = blob;
      item.blobSize = blob.size;
      item.previewUrl = URL.createObjectURL(blob);
      renderResizeModal();
    }, mime, quality);
  }

  function reprocessAllResizeItems() {
    resizeItems.forEach((item) => { if (item.status === "ready") processResizeItem(item); });
  }

  function removeResizeItem(id) {
    const item = resizeItems.find((i) => i.id === id);
    if (item && item.previewUrl) URL.revokeObjectURL(item.previewUrl);
    resizeItems = resizeItems.filter((i) => i.id !== id);
    renderResizeModal();
  }

  function clearAllResizeItems() {
    resizeItems.forEach((i) => { if (i.previewUrl) URL.revokeObjectURL(i.previewUrl); });
    resizeItems = [];
    renderResizeModal();
  }

  function resizeOutputName(item) {
    const ext = resizeFormat === "webp" ? "webp" : "png";
    const base = item.name.replace(/\.[^.]+$/, "");
    return `${base}.${ext}`;
  }

  function resizeUniqueNames(list) {
    const used = new Map();
    return list.map((item) => {
      let name = resizeOutputName(item);
      if (used.has(name)) {
        const n = used.get(name) + 1;
        used.set(name, n);
        const dot = name.lastIndexOf(".");
        name = `${name.slice(0, dot)}-${n}${name.slice(dot)}`;
      } else {
        used.set(name, 1);
      }
      return { item, name };
    });
  }

  function downloadResizeItem(item) {
    if (!item.blob) return;
    const a = document.createElement("a");
    a.href = item.previewUrl;
    a.download = resizeOutputName(item);
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    return (bytes / 1024).toFixed(1) + " KB";
  }

  function crc32(buf) {
    let crc = ~0;
    for (let i = 0; i < buf.length; i++) {
      crc ^= buf[i];
      for (let j = 0; j < 8; j++) crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
    }
    return (~crc) >>> 0;
  }

  function makeZip(files) {
    const localParts = [], centralParts = [];
    let offset = 0;
    const encoder = new TextEncoder();
    for (const f of files) {
      const nameBytes = encoder.encode(f.name);
      const crc = crc32(f.data);
      const size = f.data.length;
      const localHeader = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(localHeader.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true); lv.setUint16(6, 0, true); lv.setUint16(8, 0, true);
      lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
      lv.setUint32(14, crc, true); lv.setUint32(18, size, true); lv.setUint32(22, size, true);
      lv.setUint16(26, nameBytes.length, true); lv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);
      localParts.push(localHeader, f.data);

      const centralHeader = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(centralHeader.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0, true);
      cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, size, true); cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      centralHeader.set(nameBytes, 46);
      centralParts.push(centralHeader);
      offset += localHeader.length + f.data.length;
    }
    const centralSize = centralParts.reduce((a, b) => a + b.length, 0);
    const centralOffset = offset;
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true); ev.setUint32(16, centralOffset, true);
    ev.setUint16(20, 0, true);
    return new Blob([...localParts, ...centralParts, end], { type: "application/zip" });
  }

  async function downloadAllResizeZip() {
    const ready = resizeItems.filter((i) => i.status === "ready" && i.blob);
    if (ready.length === 0) return;
    const named = resizeUniqueNames(ready);
    const files = [];
    for (const { item, name } of named) {
      const buf = await item.blob.arrayBuffer();
      files.push({ name, data: new Uint8Array(buf) });
    }
    const zipBlob = makeZip(files);
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "logos-resized.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast(t("toast.downloadedZip").replace("{count}", files.length));
  }

  async function pullLogosFromPlaylist() {
    const scopeChannels = selected.size > 0 ? channels.filter((c) => selected.has(c.id)) : getFiltered();
    const withLogos = scopeChannels.filter((c) => c.attrs["tvg-logo"]);
    if (withLogos.length === 0) {
      showToast(t("toast.noLogoTvgSet"));
      return;
    }
    // dedupe by URL so the same shared logo isn't fetched/added twice
    const seen = new Map();
    for (const ch of withLogos) {
      const url = ch.attrs["tvg-logo"];
      if (!seen.has(url)) seen.set(url, ch.name);
    }
    showToast(t("toast.pullingLogos").replace("{count}", seen.size));
    let okCount = 0, failCount = 0;
    for (const [url, chName] of seen.entries()) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("bad status");
        const blob = await res.blob();
        const ext = (blob.type && blob.type.split("/")[1]) || url.split(".").pop().split("?")[0] || "png";
        const safeName = chName.replace(/[^a-z0-9]+/gi, "-").toLowerCase().replace(/^-+|-+$/g, "") || "logo";
        addResizeItemFromBlob(`${safeName}.${ext}`, blob);
        okCount++;
      } catch (err) {
        failCount++;
      }
    }
    renderResizeModal();
    if (failCount === 0) {
      showToast(t("toast.pulledLogos").replace("{count}", okCount));
    } else {
      showToast(t("toast.pulledLogosPartial").replace("{count}", okCount).replace("{fail}", failCount));
    }
  }

  // ---------- toast ----------
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  // ---------- derived data ----------
  function getFiltered() {
    const q = search.trim().toLowerCase();
    return channels.filter((ch) => {
      if (activeGroup !== "__all__" && groupOf(ch) !== activeGroup) return false;
      if (!q) return true;
      return ch.name.toLowerCase().includes(q) ||
             ch.url.toLowerCase().includes(q) ||
             (ch.attrs["tvg-id"] || "").toLowerCase().includes(q);
    });
  }

  // keeps groupOrder in sync with the groups that actually exist: preserves the
  // user's custom order, drops stale groups, and appends any new ones alphabetically
  function syncGroupOrder(existingGroupNames) {
    const existingSet = new Set(existingGroupNames);
    const kept = groupOrder.filter((g) => existingSet.has(g));
    const already = new Set(kept);
    // existingGroupNames is already in physical file order (built by iterating
    // `channels` in sequence) — preserve that order for anything not yet ranked,
    // rather than alphabetizing it away
    const newOnes = existingGroupNames.filter((g) => !already.has(g));
    groupOrder = kept.concat(newOnes);
    return groupOrder;
  }

  // orders an arbitrary (possibly filtered) subset of group names by the canonical
  // groupOrder, without mutating it — safe to use on a search-filtered subset
  function orderGroupNames(names) {
    const known = groupOrder.filter((g) => names.includes(g));
    const already = new Set(known);
    const rest = names.filter((g) => !already.has(g));
    return known.concat(rest);
  }

  // physically groups channels contiguously by category, in groupOrder's sequence —
  // this is what makes category order actually mean something to players reading
  // the exported file, since most infer tab order from first-appearance in the file
  function reorderChannelsByGroupOrder() {
    const buckets = new Map();
    for (const ch of channels) {
      const g = groupOf(ch);
      if (!buckets.has(g)) buckets.set(g, []);
      buckets.get(g).push(ch);
    }
    const newArr = [];
    for (const g of groupOrder) {
      if (buckets.has(g)) { newArr.push(...buckets.get(g)); buckets.delete(g); }
    }
    for (const [, chans] of buckets) newArr.push(...chans);
    channels = newArr;
  }

  function reorderGroupOrder(sourceGroup, targetGroup, position) {
    const idx = groupOrder.indexOf(sourceGroup);
    if (idx === -1) return;
    groupOrder.splice(idx, 1);
    let insertIdx = groupOrder.indexOf(targetGroup);
    if (insertIdx === -1) insertIdx = groupOrder.length;
    else if (position === "after") insertIdx += 1;
    groupOrder.splice(insertIdx, 0, sourceGroup);
    reorderChannelsByGroupOrder();
  }

  function moveGroupOrder(groupName, direction) {
    const idx = groupOrder.indexOf(groupName);
    if (idx === -1) return;
    const swapIdx = idx + direction;
    if (swapIdx < 0 || swapIdx >= groupOrder.length) return;
    [groupOrder[idx], groupOrder[swapIdx]] = [groupOrder[swapIdx], groupOrder[idx]];
    reorderChannelsByGroupOrder();
    render();
  }

  function getGroups() {
    const map = new Map();
    for (const ch of channels) {
      const g = groupOf(ch);
      map.set(g, (map.get(g) || 0) + 1);
    }
    const orderedNames = syncGroupOrder(Array.from(map.keys()));
    return orderedNames.map((g) => [g, map.get(g)]);
  }

  function getByGroup(filtered) {
    const map = new Map();
    for (const ch of filtered) {
      const g = groupOf(ch);
      if (!map.has(g)) map.set(g, []);
      map.get(g).push(ch);
    }
    const orderedNames = orderGroupNames(Array.from(map.keys()));
    return orderedNames.map((g) => [g, map.get(g)]);
  }

  // ---------- rendering ----------
  function render() {
    document.getElementById("readoutChannels").textContent = String(channels.length).padStart(3, "0");
    const groups = getGroups();
    document.getElementById("readoutGroups").textContent = String(groups.length).padStart(2, "0");
    document.getElementById("fileChip").textContent = fileName;

    const epgChip = document.getElementById("epgChip");
    if (epgChannels.size > 0) {
      epgChip.textContent = epgSources.length > 1
        ? t("epgChip.channelsMulti").replace("{count}", epgChannels.size).replace("{sources}", epgSources.length)
        : t("epgChip.channelsLoaded").replace("{count}", epgChannels.size);
      epgChip.style.color = "var(--success-text)";
    } else if (epgSources.length > 0) {
      epgChip.textContent = t("epgChip.notLoaded");
      epgChip.style.color = "var(--warn-text)";
    } else {
      epgChip.textContent = t("epgChip.none");
      epgChip.style.color = "var(--text-6)";
    }

    renderGroupList(groups);
    const filtered = getFiltered();
    renderToolbar(filtered);
    renderChannels(filtered);
  }

  function renderGroupList(groups) {
    const el = document.getElementById("groupList");
    const rows = [`<button class="group-row ${activeGroup==="__all__"?"active":""}" data-group="__all__">
        <span class="group-dot"></span><span class="group-name">${t("group.all")}</span><span class="group-count mono">${channels.length}</span></button>`];
    groups.forEach(([g, count], i) => {
      rows.push(`<button class="group-row ${activeGroup===g?"active":""}" data-group="${escapeHtml(g)}">
        <span class="group-drag-handle" draggable="true" data-group="${escapeHtml(g)}" title="Drag to reorder categories">
          <svg draggable="false" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
        </span>
        <span class="group-move-buttons">
          <span class="group-move-up" data-group="${escapeHtml(g)}" title="Move up" ${i === 0 ? "data-disabled=\"1\"" : ""}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
          </span>
          <span class="group-move-down" data-group="${escapeHtml(g)}" title="Move down" ${i === groups.length - 1 ? "data-disabled=\"1\"" : ""}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </span>
        <span class="group-dot"></span><span class="group-name" title="${escapeHtml(g)}">${escapeHtml(g)}</span><span class="group-count mono">${count}</span></button>`);
    });
    el.innerHTML = rows.join("");
    el.querySelectorAll(".group-row").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        if (e.target.closest(".group-move-up, .group-move-down, .group-drag-handle")) return;
        activeGroup = btn.dataset.group;
        render();
        closeSidebar();
      });
    });
    el.querySelectorAll(".group-move-up").forEach((elMv) => {
      elMv.addEventListener("click", (e) => {
        e.stopPropagation();
        if (elMv.dataset.disabled) return;
        moveGroupOrder(elMv.dataset.group, -1);
      });
    });
    el.querySelectorAll(".group-move-down").forEach((elMv) => {
      elMv.addEventListener("click", (e) => {
        e.stopPropagation();
        if (elMv.dataset.disabled) return;
        moveGroupOrder(elMv.dataset.group, 1);
      });
    });
    attachGroupDragHandlers(el);
  }

  function attachGroupDragHandlers(container) {
    const rows = container.querySelectorAll('.group-row[data-group]:not([data-group="__all__"])');
    rows.forEach((el) => {
      const handle = el.querySelector(".group-drag-handle");
      if (handle) {
        handle.addEventListener("dragstart", (e) => {
          groupDragSource = handle.dataset.group;
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", handle.dataset.group);
        });
        handle.addEventListener("dragend", () => {
          container.querySelectorAll(".group-row").forEach((r) => r.classList.remove("drag-over-top", "drag-over-bottom"));
          groupDragSource = null;
        });
      }
      el.addEventListener("dragover", (e) => {
        if (!groupDragSource) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const rect = el.getBoundingClientRect();
        const isTop = e.clientY - rect.top < rect.height / 2;
        el.classList.toggle("drag-over-top", isTop);
        el.classList.toggle("drag-over-bottom", !isTop);
      });
      el.addEventListener("dragleave", () => {
        el.classList.remove("drag-over-top", "drag-over-bottom");
      });
      el.addEventListener("drop", (e) => {
        e.preventDefault();
        if (!groupDragSource) return;
        const targetGroup = el.dataset.group;
        el.classList.remove("drag-over-top", "drag-over-bottom");
        if (targetGroup === groupDragSource) { groupDragSource = null; return; }
        const rect = el.getBoundingClientRect();
        const isTop = e.clientY - rect.top < rect.height / 2;
        reorderGroupOrder(groupDragSource, targetGroup, isTop ? "before" : "after");
        groupDragSource = null;
        render();
        showToast(t("toast.categoryOrderUpdated"));
      });
    });
  }

  function renderToolbar(filtered) {
    const countEl = document.getElementById("selectionCount");
    countEl.textContent = selected.size > 0
      ? t("selection.selected").replace("{count}", selected.size)
      : t("selection.shown").replace("{count}", filtered.length);
    document.getElementById("btnSelectAll").style.display = selected.size > 0 ? "none" : "flex";
    document.getElementById("btnClearSel").style.display = selected.size > 0 ? "flex" : "none";
    document.getElementById("btnDeleteSel").style.display = selected.size > 0 ? "flex" : "none";
  }

  function renderChannels(filtered) {
    const container = document.getElementById("groupsContainer");
    const empty = document.getElementById("emptyState");
    const byGroup = getByGroup(filtered);

    if (byGroup.length === 0) {
      empty.style.display = "flex";
      container.innerHTML = "";
      return;
    }
    empty.style.display = "none";

    const html = byGroup.map(([g, chans]) => {
      const isCollapsed = !!collapsed[g];
      const rows = chans.map((ch) => renderRow(ch)).join("");
      return `<div class="group-block">
        <button class="group-header" data-group="${escapeHtml(g)}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${isCollapsed ? '<polyline points="9 18 15 12 9 6"/>' : '<polyline points="6 9 12 15 18 9"/>'}</svg>
          <span class="group-header-name">${escapeHtml(g)}</span>
          <span class="group-header-count mono">${chans.length}</span>
        </button>
        ${isCollapsed ? "" : `<div class="rows-wrap">${rows}</div>`}
      </div>`;
    }).join("");

    container.innerHTML = html;
    attachRowHandlers();
    attachGroupHeaderHandlers();
    attachDragHandlers();
  }

  function renderRow(ch) {
    const isChecked = selected.has(ch.id);
    const isExpanded = expandedRows.has(ch.id);
    const tvgId = ch.attrs["tvg-id"] || "";
    let epgPreviewHtml = "";
    if (epgChannels.size > 0) {
      if (tvgId && epgChannels.has(tvgId)) {
        const nn = getNowNext(tvgId);
        if (nn && nn.current) {
          epgPreviewHtml = `<div class="epg-preview" title="${escapeHtml(nn.current.title)}">Now: ${escapeHtml(nn.current.title)}</div>`;
        } else if (nn && nn.next) {
          epgPreviewHtml = `<div class="epg-preview dim" title="${escapeHtml(nn.next.title)}">Next: ${escapeHtml(nn.next.title)}</div>`;
        } else {
          epgPreviewHtml = `<div class="epg-preview dim">Matched — no programme data</div>`;
        }
      } else if (tvgId) {
        epgPreviewHtml = `<div class="epg-preview dim">tvg-id not found in loaded EPG</div>`;
      } else {
        epgPreviewHtml = `<div class="epg-preview dim">No tvg-id set</div>`;
      }
    }
    const epgPickHtml = epgChannels.size > 0
      ? `<label class="detail-field">
          <span class="detail-label">epg pick</span>
          <input class="detail-input row-epgpick" list="epgChannelDatalist" data-id="${ch.id}" placeholder="Search EPG channel…" />
        </label>`
      : "";

    const groupMembers = channels.filter((c) => groupOf(c) === groupOf(ch));
    const posInGroup = groupMembers.findIndex((c) => c.id === ch.id);
    const isFirstInGroup = posInGroup <= 0;
    const isLastInGroup = posInGroup >= groupMembers.length - 1;

    return `<div class="row ${isChecked?"checked":""} ${isExpanded?"expanded":""}" data-id="${ch.id}">
      <div class="row-main">
        <span class="icon-btn drag-handle" draggable="true" data-id="${ch.id}" title="Drag to reorder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>
        </span>
        <span class="row-move-buttons">
          <button class="icon-btn row-move-up" data-id="${ch.id}" title="Move up" ${isFirstInGroup ? "disabled" : ""}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
          <button class="icon-btn row-move-down" data-id="${ch.id}" title="Move down" ${isLastInGroup ? "disabled" : ""}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </span>
        <input type="checkbox" class="checkbox row-check" data-id="${ch.id}" ${isChecked?"checked":""} />
        <span class="tally-dot ${isChecked?"on":""}"></span>
        <input class="name-input mono row-name" data-id="${ch.id}" value="${escapeHtml(ch.name)}" spellcheck="false" />
        <button class="icon-btn row-expand" data-id="${ch.id}" title="Edit metadata">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${isExpanded ? '<polyline points="6 9 12 15 18 9"/>' : '<polyline points="9 18 15 12 9 6"/>'}</svg>
        </button>
        <button class="icon-btn danger row-delete" data-id="${ch.id}" title="Remove channel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div class="row-details">
        <label class="detail-field">
          <span class="detail-label">group-title</span>
          <input class="detail-input mono row-group" data-id="${ch.id}" value="${escapeHtml(ch.attrs["group-title"] || "")}" />
        </label>
        <label class="detail-field">
          <span class="detail-label">tvg-id</span>
          <input class="detail-input mono row-tvgid" data-id="${ch.id}" value="${escapeHtml(tvgId)}" />
          ${epgPreviewHtml}
        </label>
        ${epgPickHtml}
        <label class="detail-field">
          <span class="detail-label">tvg-logo</span>
          <input class="detail-input mono row-logo" data-id="${ch.id}" value="${escapeHtml(ch.attrs["tvg-logo"] || "")}" placeholder="https://…" />
        </label>
        <div class="url-preview">
          <span class="detail-label">stream</span>
          <span class="url-text mono" title="${escapeHtml(ch.url)}">${escapeHtml(ch.url)}</span>
        </div>
      </div>
    </div>`;
  }

  function findChannel(id) { return channels.find((c) => c.id === id); }

  function getVisibleIds() {
    return Array.from(document.querySelectorAll(".row")).map((r) => r.dataset.id);
  }

  function applySelectionClick(id, event) {
    const shift = event.shiftKey;
    const toggleOnly = event.ctrlKey || event.metaKey;

    if (shift && lastClickedId) {
      const ids = getVisibleIds();
      const from = ids.indexOf(lastClickedId);
      const to = ids.indexOf(id);
      if (from !== -1 && to !== -1) {
        const [start, end] = from <= to ? [from, to] : [to, from];
        for (let i = start; i <= end; i++) selected.add(ids[i]);
        render();
        return;
      }
    }

    // plain click or ctrl/cmd click: toggle just this one
    selected.has(id) ? selected.delete(id) : selected.add(id);
    if (!shift) lastClickedId = id;
    render();
    void toggleOnly; // ctrl/cmd behaves the same as a plain toggle here
  }

  function reorderChannel(sourceId, { targetChannelId, targetGroup, position } = {}) {
    const idx = channels.findIndex((c) => c.id === sourceId);
    if (idx === -1) return;
    const [moved] = channels.splice(idx, 1);

    if (targetGroup !== undefined) {
      if (targetGroup === "Ungrouped") delete moved.attrs["group-title"];
      else moved.attrs["group-title"] = targetGroup;
    }

    let insertIndex;
    if (targetChannelId) {
      insertIndex = channels.findIndex((c) => c.id === targetChannelId);
      if (insertIndex === -1) insertIndex = channels.length;
      else if (position === "after") insertIndex += 1;
    } else {
      // dropped on a group header with no specific row target: append to the end of that group
      let lastIdxOfGroup = -1;
      channels.forEach((c, i) => { if (groupOf(c) === targetGroup) lastIdxOfGroup = i; });
      insertIndex = lastIdxOfGroup === -1 ? channels.length : lastIdxOfGroup + 1;
    }
    channels.splice(insertIndex, 0, moved);
  }

  function moveChannelWithinGroup(id, direction) {
    const ch = findChannel(id);
    if (!ch) return;
    const group = groupOf(ch);
    const groupMembers = channels.filter((c) => groupOf(c) === group);
    const posInGroup = groupMembers.findIndex((c) => c.id === id);
    const swapPos = posInGroup + direction;
    if (swapPos < 0 || swapPos >= groupMembers.length) return;
    const other = groupMembers[swapPos];
    const idxA = channels.findIndex((c) => c.id === ch.id);
    const idxB = channels.findIndex((c) => c.id === other.id);
    [channels[idxA], channels[idxB]] = [channels[idxB], channels[idxA]];
    render();
  }

  function clearDragVisuals() {
    document.querySelectorAll(".row").forEach((r) => r.classList.remove("dragging", "drag-over-top", "drag-over-bottom"));
    document.querySelectorAll(".group-header").forEach((h) => h.classList.remove("drag-over"));
  }

  function attachDragHandlers() {
    document.querySelectorAll(".drag-handle").forEach((el) => {
      el.addEventListener("dragstart", (e) => {
        dragSourceId = el.dataset.id;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", el.dataset.id);
        requestAnimationFrame(() => {
          const row = document.querySelector(`.row[data-id="${dragSourceId}"]`);
          if (row) row.classList.add("dragging");
        });
      });
      el.addEventListener("dragend", () => {
        clearDragVisuals();
        dragSourceId = null;
      });
    });

    document.querySelectorAll(".row").forEach((rowEl) => {
      rowEl.addEventListener("dragover", (e) => {
        if (!dragSourceId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const rect = rowEl.getBoundingClientRect();
        const isTop = e.clientY - rect.top < rect.height / 2;
        rowEl.classList.toggle("drag-over-top", isTop);
        rowEl.classList.toggle("drag-over-bottom", !isTop);
      });
      rowEl.addEventListener("dragleave", () => {
        rowEl.classList.remove("drag-over-top", "drag-over-bottom");
      });
      rowEl.addEventListener("drop", (e) => {
        e.preventDefault();
        if (!dragSourceId) return;
        const targetId = rowEl.dataset.id;
        if (targetId === dragSourceId) { clearDragVisuals(); dragSourceId = null; return; }
        const rect = rowEl.getBoundingClientRect();
        const isTop = e.clientY - rect.top < rect.height / 2;
        const targetChannel = findChannel(targetId);
        reorderChannel(dragSourceId, {
          targetChannelId: targetId,
          targetGroup: groupOf(targetChannel),
          position: isTop ? "before" : "after",
        });
        dragSourceId = null;
        render();
        showToast(t("toast.channelMoved"));
      });
    });

    document.querySelectorAll(".group-header").forEach((headerEl) => {
      headerEl.addEventListener("dragover", (e) => {
        if (!dragSourceId) return;
        e.preventDefault();
        headerEl.classList.add("drag-over");
      });
      headerEl.addEventListener("dragleave", () => headerEl.classList.remove("drag-over"));
      headerEl.addEventListener("drop", (e) => {
        e.preventDefault();
        if (!dragSourceId) return;
        const destGroup = headerEl.dataset.group;
        reorderChannel(dragSourceId, { targetGroup: destGroup });
        dragSourceId = null;
        render();
        showToast(t("toast.channelMovedToGroup").replace("{group}", destGroup));
      });
    });
  }

  function attachRowHandlers() {
    document.querySelectorAll(".row-move-up").forEach((el) => {
      el.addEventListener("click", () => moveChannelWithinGroup(el.dataset.id, -1));
    });
    document.querySelectorAll(".row-move-down").forEach((el) => {
      el.addEventListener("click", () => moveChannelWithinGroup(el.dataset.id, 1));
    });
    document.querySelectorAll(".row-check").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        applySelectionClick(el.dataset.id, e);
      });
    });
    document.querySelectorAll(".row-main").forEach((el) => {
      el.addEventListener("click", (e) => {
        // clicking the row itself selects it too, unless the click is on an
        // input, button, or the drag handle (which handle themselves)
        if (e.target.closest("input, button, .drag-handle")) return;
        applySelectionClick(el.closest(".row").dataset.id, e);
      });
    });
    document.querySelectorAll(".row-name").forEach((el) => {
      el.addEventListener("input", () => { findChannel(el.dataset.id).name = el.value; });
      el.addEventListener("change", () => render());
    });
    document.querySelectorAll(".row-group").forEach((el) => {
      el.addEventListener("change", () => { findChannel(el.dataset.id).attrs["group-title"] = el.value; render(); });
    });
    document.querySelectorAll(".row-tvgid").forEach((el) => {
      el.addEventListener("change", () => { findChannel(el.dataset.id).attrs["tvg-id"] = el.value; render(); });
    });
    document.querySelectorAll(".row-epgpick").forEach((el) => {
      el.addEventListener("change", () => {
        const val = el.value;
        const sep = val.lastIndexOf(" — ");
        if (sep === -1) return;
        const id = val.slice(sep + 3).trim();
        if (!epgChannels.has(id)) return;
        findChannel(el.dataset.id).attrs["tvg-id"] = id;
        render();
      });
    });
    document.querySelectorAll(".row-logo").forEach((el) => {
      el.addEventListener("change", () => { findChannel(el.dataset.id).attrs["tvg-logo"] = el.value; });
    });
    document.querySelectorAll(".row-expand").forEach((el) => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        expandedRows.has(id) ? expandedRows.delete(id) : expandedRows.add(id);
        render();
      });
    });
    document.querySelectorAll(".row-delete").forEach((el) => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        channels = channels.filter((c) => c.id !== id);
        selected.delete(id);
        render();
      });
    });
  }

  function attachGroupHeaderHandlers() {
    document.querySelectorAll(".group-header").forEach((el) => {
      el.addEventListener("click", () => {
        const g = el.dataset.group;
        collapsed[g] = !collapsed[g];
        render();
      });
    });
  }

  // ---------- actions ----------
  function applyLoadedPlaylist(parsedResult, sourceLabel) {
    const { channels: parsedChannels, epgUrl } = parsedResult;
    if (parsedChannels.length === 0) return false;
    channels = parsedChannels;
    // a playlist's url-tvg can itself already be a comma-separated list of guide
    // URLs (this tool writes it that way, and so do some players) — carry each
    // one over as its own not-yet-fetched source so the user can load them.
    epgSources = [];
    if (epgUrl) {
      epgUrl.split(",").map((u) => u.trim()).filter(Boolean).forEach((u) => {
        addOrUpdateEpgSource({ url: u, label: u, channelsMap: new Map(), programmesMap: new Map() });
      });
    } else {
      recomputeEpgCombined();
    }
    selected = new Set();
    activeGroup = "__all__";
    groupOrder = [];
    fileName = sourceLabel;
    loadSettingsForCurrentFile();
    render();
    return true;
  }

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = parseM3U(String(e.target.result));
        if (!applyLoadedPlaylist(parsed, file.name)) {
          showToast(t("toast.noChannelsFoundFile"));
          return;
        }
        showToast(t("toast.loadedChannels").replace("{count}", parsed.channels.length));
      } catch (err) {
        showToast(t("toast.couldntParseFile"));
      }
    };
    reader.readAsText(file);
  }

  function handleExport() {
    const exportUrl = getEpgExportUrl();
    const text = serializeM3U(channels, exportUrl);
    const blob = new Blob([text], { type: "audio/x-mpegurl" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const base = fileName.replace(/\.(m3u8?|txt)$/i, "");
    a.href = url;
    a.download = `${base}-edited.m3u`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    if (epgChannels.size > 0 && !exportUrl) {
      showToast(t("toast.exportedNoEpg"));
    } else {
      const urlCount = exportUrl ? exportUrl.split(",").length : 0;
      showToast(urlCount > 1 ? t("toast.exportedMultiEpg").replace("{count}", urlCount) : t("toast.exportedSingle"));
    }
  }

  function applyBulkFindReplace() {
    const findText = document.getElementById("findText").value;
    const replaceText = document.getElementById("replaceText").value;
    if (!findText) return;
    const filtered = getFiltered();
    const ids = selected.size > 0 ? selected : new Set(filtered.map((c) => c.id));
    let count = 0;
    channels = channels.map((ch) => {
      if (!ids.has(ch.id)) return ch;
      if (ch.name.includes(findText)) {
        count++;
        return { ...ch, name: ch.name.split(findText).join(replaceText) };
      }
      return ch;
    });
    showToast(count > 0 ? t("toast.replacedInNames").replace("{count}", count) : t("toast.noMatchesFound"));
    selected = new Set();
    render();
  }

  function applyCleanupPass() {
    const filtered = getFiltered();
    const ids = selected.size > 0 ? selected : new Set(filtered.map((c) => c.id));
    channels = channels.map((ch) => {
      if (!ids.has(ch.id)) return ch;
      const cleanedName = titleCase(ch.name.replace(/\s+/g, " ").trim().replace(/\s*\[.*?\]\s*/g, " ").trim());
      const cleanedGroup = ch.attrs["group-title"] ? ch.attrs["group-title"].replace(/\s+/g, " ").trim() : ch.attrs["group-title"];
      return { ...ch, name: cleanedName, attrs: { ...ch.attrs, "group-title": cleanedGroup } };
    });
    showToast(t("toast.cleanedUp"));
    selected = new Set();
    render();
  }

  function applyBulkGroup() {
    const bulkGroupEl = document.getElementById("bulkGroup");
    const val = bulkGroupEl.value.trim();
    if (!val) return;
    const filtered = getFiltered();
    const ids = selected.size > 0 ? selected : new Set(filtered.map((c) => c.id));
    channels = channels.map((ch) => ids.has(ch.id) ? { ...ch, attrs: { ...ch.attrs, "group-title": val } } : ch);
    showToast(t("toast.assignedGroup").replace("{count}", ids.size).replace("{group}", val));
    bulkGroupEl.value = "";
    selected = new Set();
    render();
  }

  // Rewrites only the stream URL's scheme (http/https), leaving host/path/query
  // untouched. Useful when a provider's http-only server ends up with https
  // stream URLs (e.g. some Xtream panels mirror whatever scheme the request to
  // get.php came in on, so a browser silently upgrading that fetch to https
  // can make the *returned* stream links https too, even though the actual
  // stream host never supports it).
  function applyForceUrlScheme(scheme) {
    const filtered = getFiltered();
    const ids = selected.size > 0 ? selected : new Set(filtered.map((c) => c.id));
    let count = 0;
    channels = channels.map((ch) => {
      if (!ids.has(ch.id)) return ch;
      const m = ch.url.match(/^(https?):\/\//i);
      if (!m || m[1].toLowerCase() === scheme) return ch;
      count++;
      return { ...ch, url: scheme + ch.url.slice(m[1].length) };
    });
    showToast(count > 0 ? t("toast.changedScheme").replace("{count}", count).replace("{scheme}", scheme) : t("toast.noSchemeChangeNeeded"));
    selected = new Set();
    render();
  }

  function deleteSelected() {
    if (selected.size === 0) return;
    const n = selected.size;
    channels = channels.filter((c) => !selected.has(c.id));
    selected = new Set();
    showToast(t("toast.removedChannels").replace("{count}", n));
    render();
  }

  // ---------- logo matcher modal ----------
  function openLogoModal() {
    logoModalOpen = true;
    renderLogoModal();
  }

  function closeLogoModal() {
    logoModalOpen = false;
    renderLogoModal();
  }

  function scoreClass(score) {
    if (score >= 0.75) return "high";
    if (score >= 0.45) return "mid";
    return "none";
  }

  function renderLogoModal() {
    const root = document.getElementById("logoModalRoot");
    if (!logoModalOpen) { root.innerHTML = ""; return; }
    const prevBody = root.querySelector(".modal-body");
    const prevScrollTop = prevBody ? prevBody.scrollTop : 0;

    const scopeChannels = selected.size > 0 ? channels.filter((c) => selected.has(c.id)) : getFiltered();
    const scopeLabel = selected.size > 0 ? t("scope.selected").replace("{count}", selected.size) : t("scope.shown").replace("{count}", scopeChannels.length);
    const acceptedCount = logoMatchResults.filter((r) => r.accepted && r.bestFile).length;

    const statusHtml = logoStatus
      ? `<div class="modal-status ${logoStatus.type}">${escapeHtml(logoStatus.text)}</div>`
      : "";

    const visibleLogoResults = logoOnlyNeedsReview ? logoMatchResults.filter((r) => !r.alreadyGood) : logoMatchResults;
    const logoAlreadyGoodCount = logoMatchResults.length - visibleLogoResults.length;

    const rowsHtml = visibleLogoResults.map((r) => {
      const cls = scoreClass(r.score);
      const pct = Math.round(r.score * 100);
      const thumb = r.bestFile
        ? `<div class="match-thumb"><img src="${escapeHtml(r.bestFile.download_url)}" loading="lazy" alt="" /></div>`
        : `<div class="match-thumb"></div>`;
      const scoreLabel = r.bestFile ? `${pct}%` : "—";
      const checkbox = `<input type="checkbox" class="match-check logo-match-check" data-id="${r.channelId}" ${r.accepted ? "checked" : ""} ${r.bestFile ? "" : "disabled"} />`;
      return `<div class="match-row">
        ${checkbox}
        <span class="match-channel-name" title="${escapeHtml(r.channelName)}">${escapeHtml(r.channelName)}</span>
        ${thumb}
        <input class="match-pick-input logo-match-pick" list="logoFileDatalist" data-id="${r.channelId}" value="${r.bestFile ? escapeHtml(r.bestFile.name) : ""}" placeholder="${escapeHtml(t("logo.pickPlaceholder"))}" title="${escapeHtml(t("logo.pickTitle"))}" />
        <span class="match-score ${cls}">${scoreLabel}</span>
      </div>`;
    }).join("");

    const resultsSection = logoMatchResults.length > 0 ? `
      <div class="match-scope-row">
        <span class="match-scope-text">${escapeHtml(t("logo.matchingAgainst").replace("{scope}", scopeLabel))}</span>
        <div class="match-quick-actions">
          <button class="btn-ghost-small" id="btnAcceptAll">${escapeHtml(t("match.acceptAll"))}</button>
          <button class="btn-ghost-small" id="btnRejectAll">${escapeHtml(t("match.rejectAll"))}</button>
        </div>
      </div>
      <label class="form-check-row" style="gap:6px; margin-bottom:6px; cursor:pointer;">
        <input type="checkbox" id="logoOnlyReviewToggle" ${logoOnlyNeedsReview ? "checked" : ""} />
        <span style="font-size:11px; color:var(--text-5);">${escapeHtml(t("logo.onlyReview"))}${logoAlreadyGoodCount > 0 ? escapeHtml(t("logo.onlyReviewHiding").replace("{count}", logoAlreadyGoodCount)) : ""}</span>
      </label>
      <div>${rowsHtml || `<div class="modal-hint">${escapeHtml(logoMatchResults.length > 0 ? t("logo.nothingToReviewAllGood") : t("logo.nothingToReview"))}</div>`}</div>
    ` : "";

    root.innerHTML = `
      <div class="modal-overlay" id="logoModalOverlay">
        <div class="modal-box modal-box-lg">
          <div class="modal-header">
            <div>
              <div class="modal-title">${escapeHtml(t("logo.title"))}</div>
              <div class="modal-subtitle">${escapeHtml(t("logo.subtitle"))}</div>
            </div>
            <button class="icon-btn" id="btnCloseLogoModal" title="Close">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="modal-body">
            <div class="modal-url-row">
              <input class="modal-url-input mono" id="logoUrlInput" placeholder="${escapeHtml(t("logo.urlPlaceholder"))}" value="${escapeHtml(logoUrlValue)}" />
              <button class="btn-primary" id="btnFetchLogos" style="padding:8px 14px;">${escapeHtml(t("logo.fetch"))}</button>
            </div>
            <div class="modal-hint">${escapeHtml(t("logo.hint"))}</div>
            ${statusHtml}
            ${resultsSection}
          </div>
          <div class="modal-footer">
            <button class="btn-ghost-small" id="btnCancelLogoModal">${escapeHtml(t("match.cancel"))}</button>
            <button class="btn-primary" id="btnApplyLogoMatches" style="padding:8px 14px;" ${acceptedCount === 0 ? "disabled" : ""}>${escapeHtml(t("logo.applyBtn").replace("{count}", acceptedCount))}</button>
          </div>
        </div>
      </div>
    `;

    attachLogoModalHandlers();
    const newBody = root.querySelector(".modal-body");
    if (newBody) newBody.scrollTop = prevScrollTop;
  }

  function attachLogoModalHandlers() {
    const overlay = document.getElementById("logoModalOverlay");
    if (!overlay) return;

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeLogoModal();
    });
    document.getElementById("btnCloseLogoModal").addEventListener("click", closeLogoModal);
    document.getElementById("btnCancelLogoModal").addEventListener("click", closeLogoModal);

    const logoReviewToggle = document.getElementById("logoOnlyReviewToggle");
    if (logoReviewToggle) logoReviewToggle.addEventListener("change", (e) => { logoOnlyNeedsReview = e.target.checked; renderLogoModal(); });

    const urlInput = document.getElementById("logoUrlInput");
    urlInput.addEventListener("input", (e) => { logoUrlValue = e.target.value; });
    urlInput.addEventListener("blur", saveSettings);
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); fetchLogoFolder(logoUrlValue); }
    });

    document.getElementById("btnFetchLogos").addEventListener("click", () => fetchLogoFolder(logoUrlValue));

    const applyBtn = document.getElementById("btnApplyLogoMatches");
    if (applyBtn) applyBtn.addEventListener("click", applyLogoMatches);

    document.querySelectorAll(".logo-match-check").forEach((el) => {
      el.addEventListener("change", () => {
        const id = el.dataset.id;
        const r = logoMatchResults.find((m) => m.channelId === id);
        if (r) r.accepted = el.checked;
        renderLogoModal();
      });
    });
    document.querySelectorAll(".logo-match-pick").forEach((el) => {
      el.addEventListener("change", () => {
        const r = logoMatchResults.find((m) => m.channelId === el.dataset.id);
        if (!r) return;
        const val = el.value.trim();
        if (!val) {
          r.bestFile = null;
          r.score = 0;
          r.accepted = false;
          r.alreadyGood = false;
          renderLogoModal();
          return;
        }
        const file = logoFetchedFiles.find((f) => f.name === val);
        if (!file) {
          showToast(t("toast.pickFilenameToLink"));
          renderLogoModal();
          return;
        }
        r.bestFile = file;
        r.score = 1;
        r.accepted = true;
        r.alreadyGood = false;
        renderLogoModal();
      });
    });

    const acceptAllBtn = document.getElementById("btnAcceptAll");
    if (acceptAllBtn) acceptAllBtn.addEventListener("click", () => {
      logoMatchResults.forEach((r) => { if (r.bestFile) r.accepted = true; });
      renderLogoModal();
    });
    const rejectAllBtn = document.getElementById("btnRejectAll");
    if (rejectAllBtn) rejectAllBtn.addEventListener("click", () => {
      logoMatchResults.forEach((r) => { r.accepted = false; });
      renderLogoModal();
    });
  }

  function attachLoadModalHandlers() {
    const overlay = document.getElementById("loadModalOverlay");
    if (!overlay) return;
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeLoadModal(); });
    document.getElementById("btnCloseLoadModal").addEventListener("click", closeLoadModal);
    document.getElementById("btnCancelLoadModal").addEventListener("click", closeLoadModal);
    document.getElementById("tabUrl").addEventListener("click", () => { loadModalTab = "url"; loadStatus = null; renderLoadModal(); });
    document.getElementById("tabXtream").addEventListener("click", () => { loadModalTab = "xtream"; loadStatus = null; renderLoadModal(); });

    if (loadModalTab === "url") {
      const input = document.getElementById("loadUrlInput");
      // not saved on every change here either — see doLoadFromUrl, which saves
      // it under the new file's own key right before fetching
      input.addEventListener("input", (e) => { loadUrlValue = e.target.value; });
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doLoadFromUrl(); } });
    } else {
      // note: these fields aren't saved on every change here — they belong to
      // whichever playlist this portal load is *about to* create, not the
      // currently-loaded one, so they're persisted only once that's known (see
      // doLoadFromXtream, which saves them under the new file's own key right
      // before fetching, and loadSettingsForCurrentFile which then restores them)
      document.getElementById("xtreamServer").addEventListener("input", (e) => { xtreamServer = e.target.value; refreshXtreamLinksBox(); });
      document.getElementById("xtreamUsername").addEventListener("input", (e) => { xtreamUsername = e.target.value; refreshXtreamLinksBox(); });
      document.getElementById("xtreamPassword").addEventListener("input", (e) => { xtreamPassword = e.target.value; refreshXtreamLinksBox(); });
      document.getElementById("xtreamOutput").addEventListener("change", (e) => { xtreamOutput = e.target.value; refreshXtreamLinksBox(); });
      document.getElementById("xtreamFetchEpg").addEventListener("change", (e) => { xtreamFetchEpg = e.target.checked; });
    }

    document.getElementById("btnDoLoad").addEventListener("click", () => {
      if (loadModalTab === "url") doLoadFromUrl();
      else doLoadFromXtream();
    });
  }

  async function doLoadFromUrl() {
    if (!loadUrlValue.trim()) return;
    loadStatus = { type: "loading", text: t("load.fetchingPlaylist") };
    renderLoadModal();
    const label = loadUrlValue.trim().split("/").pop() || "playlist.m3u";
    // stash the current fields under the file's eventual settings key first, so
    // the per-file load that happens right after this succeeds restores these
    // same just-typed values instead of blanking them
    saveSettings(label);
    try {
      const count = await fetchPlaylistFromUrl(loadUrlValue.trim(), label);
      showToast(t("toast.loadedChannels").replace("{count}", count));
      closeLoadModal();
    } catch (err) {
      loadStatus = { type: "error", text: friendlyFetchError(err) };
      renderLoadModal();
    }
  }

  async function doLoadFromXtream() {
    if (!xtreamServer.trim() || !xtreamUsername.trim() || !xtreamPassword.trim()) {
      loadStatus = { type: "error", text: t("load.credentialsRequired") };
      renderLoadModal();
      return;
    }
    loadStatus = { type: "loading", text: t("load.fetchingFromPortal") };
    renderLoadModal();
    const { m3uUrl, epgUrl } = buildXtreamUrls({ server: xtreamServer, username: xtreamUsername, password: xtreamPassword, output: xtreamOutput });
    const xtreamLabel = `xtream-${xtreamUsername.trim()}.m3u`;
    // stash the current fields under the file's eventual settings key first, so
    // the per-file load that happens right after this succeeds restores these
    // same just-typed credentials instead of blanking them
    saveSettings(xtreamLabel);
    try {
      const count = await fetchPlaylistFromUrl(m3uUrl, xtreamLabel);
      showToast(t("toast.loadedFromPortal").replace("{count}", count));
      closeLoadModal();
      if (xtreamFetchEpg) {
        epgUrlValue = epgUrl;
        openEpgModal();
        fetchEpg(epgUrl);
      } else {
        // not fetching now, but still record it as a source so url-tvg is written on export
        addOrUpdateEpgSource({ url: epgUrl, label: epgUrl, channelsMap: new Map(), programmesMap: new Map() });
      }
    } catch (err) {
      loadStatus = { type: "error", text: friendlyFetchError(err) };
      renderLoadModal();
    }
  }

  function attachEpgModalHandlers() {
    const overlay = document.getElementById("epgModalOverlay");
    if (!overlay) return;

    const reviewToggle = document.getElementById("epgOnlyReviewToggle");
    if (reviewToggle) reviewToggle.addEventListener("change", (e) => { epgOnlyNeedsReview = e.target.checked; renderEpgModal(); });
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeEpgModal(); });
    document.getElementById("btnCloseEpgModal").addEventListener("click", closeEpgModal);
    document.getElementById("btnCancelEpgModal").addEventListener("click", closeEpgModal);

    const urlInput = document.getElementById("epgUrlInput");
    urlInput.addEventListener("input", (e) => {
      epgUrlValue = e.target.value;
      const linkBox = document.getElementById("epgOpenLinkBox");
      if (linkBox) {
        linkBox.innerHTML = epgUrlValue.trim()
          ? `<a href="${escapeHtml(epgUrlValue)}" target="_blank" rel="noopener" class="btn-ghost-small" style="text-decoration:none;">Open link ↗</a>`
          : "";
      }
    });
    // leaving the field with a typed URL still not fetched records it as a
    // source (with no data yet) so url-tvg is written on export either way
    urlInput.addEventListener("blur", () => {
      const url = epgUrlValue.trim();
      if (url && !epgSources.some((s) => s.url === url)) {
        addOrUpdateEpgSource({ url, label: url, channelsMap: new Map(), programmesMap: new Map() });
        renderEpgModal();
      }
    });
    urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); if (epgUrlValue.trim()) fetchEpg(epgUrlValue.trim()); } });
    document.getElementById("btnFetchEpg").addEventListener("click", () => { if (epgUrlValue.trim()) fetchEpg(epgUrlValue.trim()); });

    document.getElementById("btnEpgFromFile").addEventListener("click", () => document.getElementById("epgFileInput").click());
    document.getElementById("epgFileInput").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) loadEpgFromFile(f);
      e.target.value = "";
    });

    document.querySelectorAll(".epg-remove-source").forEach((el) => {
      el.addEventListener("click", () => {
        removeEpgSource(el.dataset.id);
        renderEpgModal();
      });
    });
    document.querySelectorAll(".epg-fetch-source").forEach((el) => {
      el.addEventListener("click", () => { if (el.dataset.url) fetchEpg(el.dataset.url); });
    });

    const applyBtn = document.getElementById("btnApplyEpgMatches");
    if (applyBtn) applyBtn.addEventListener("click", applyEpgMatches);

    document.querySelectorAll(".epg-match-check").forEach((el) => {
      el.addEventListener("change", () => {
        const r = epgMatchResults.find((m) => m.channelId === el.dataset.id);
        if (r) r.accepted = el.checked;
        renderEpgModal();
      });
    });
    document.querySelectorAll(".epg-match-pick").forEach((el) => {
      el.addEventListener("change", () => {
        const r = epgMatchResults.find((m) => m.channelId === el.dataset.id);
        if (!r) return;
        const val = el.value.trim();
        if (!val) {
          r.bestMatch = null;
          r.score = 0;
          r.accepted = false;
          r.alreadyGood = false;
          renderEpgModal();
          return;
        }
        const sep = val.lastIndexOf(" — ");
        const id = sep === -1 ? null : val.slice(sep + 3).trim();
        const epgEntry = id ? epgChannels.get(id) : null;
        if (!epgEntry) {
          showToast(t("toast.pickChannelToLink"));
          renderEpgModal();
          return;
        }
        r.bestMatch = epgEntry;
        r.score = 1;
        r.accepted = true;
        r.alreadyGood = false;
        renderEpgModal();
      });
    });
    const acceptAllBtn = document.getElementById("btnEpgAcceptAll");
    if (acceptAllBtn) acceptAllBtn.addEventListener("click", () => {
      epgMatchResults.forEach((r) => { if (r.bestMatch) r.accepted = true; });
      renderEpgModal();
    });
    const rejectAllBtn = document.getElementById("btnEpgRejectAll");
    if (rejectAllBtn) rejectAllBtn.addEventListener("click", () => {
      epgMatchResults.forEach((r) => { r.accepted = false; });
      renderEpgModal();
    });
  }
