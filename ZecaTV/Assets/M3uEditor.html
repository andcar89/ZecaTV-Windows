<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Playlist Bench — M3U Editor</title>
<style>
  :root {
    --bg-body: #0B0E11;
    --bg-panel: #10151B;
    --bg-footer: #0D1117;
    --bg-input: #12171D;
    --bg-sunken: #14181F;
    --bg-elevated: #141A21;
    --bg-row-active: #132018;
    --border-1: #1B2128;
    --border-2: #232B34;
    --border-3: #171D24;
    --border-4: #2A323B;
    --icon-muted: #3A424D;
    --scrollbar-thumb: #1F2730;
    --text-0: #F2F5F8;
    --text-1: #E6EDF3;
    --text-2: #C6D0DA;
    --text-3: #AEB8C4;
    --text-4: #9AA5B1;
    --text-5: #8B96A5;
    --text-6: #5C6773;
    --text-7: #4B5560;
    --accent: #3DDC84;
    --accent-focus: #2E8B57;
    --accent-strong: #1B7A44;
    --on-accent-strong: #EAFBF1;
    --success-bg: #0F1A14;
    --success-text: #8FE3B0;
    --success-border: #1F5A38;
    --score-high-bg: #12321F;
    --row-active-text: #EAFBF1;
    --error-bg: #241315;
    --error-border: #5A2323;
    --error-text: #F0A0A5;
    --danger-icon: #7A4348;
    --warn-bg: #2E2410;
    --warn-text: #F2B84B;
  }
  :root[data-theme="light"] {
    --bg-body: #F3F5F7;
    --bg-panel: #FFFFFF;
    --bg-footer: #EEF1F4;
    --bg-input: #FFFFFF;
    --bg-sunken: #EEF0F3;
    --bg-elevated: #EDEFF2;
    --bg-row-active: #E3F7EC;
    --border-1: #E1E4E9;
    --border-2: #D6DADF;
    --border-3: #EAECEF;
    --border-4: #CDD2D9;
    --icon-muted: #AEB6BF;
    --scrollbar-thumb: #C7CCD3;
    --text-0: #0D1117;
    --text-1: #1A2027;
    --text-2: #333B44;
    --text-3: #454E58;
    --text-4: #5C6773;
    --text-5: #68727D;
    --text-6: #7C8794;
    --text-7: #8A93A0;
    --accent: #1F9D5C;
    --accent-focus: #2E8B57;
    --accent-strong: #1B7A44;
    --on-accent-strong: #EAFBF1;
    --success-bg: #EAFBF1;
    --success-text: #1C7A45;
    --success-border: #8FD9AE;
    --score-high-bg: #DCF5E6;
    --row-active-text: #0F3D22;
    --error-bg: #FCEAEA;
    --error-border: #E8A9AD;
    --error-text: #A83A40;
    --danger-icon: #B4525A;
    --warn-bg: #FCF3DE;
    --warn-text: #8A5A00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg-body);
    color: var(--text-1);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 99px; }
  input:focus { outline: none; border-color: var(--accent-focus) !important; }
  button { font-family: inherit; cursor: pointer; }
  button:hover { filter: brightness(1.15); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(4,6,8,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  .modal-box {
    width: 640px; max-width: 100%; max-height: 84vh; display: flex; flex-direction: column;
    background: var(--bg-panel); border: 1px solid var(--border-2); border-radius: 12px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5); overflow: hidden;
  }
  /* Logos / EPG / Resize logos get noticeably more room to work in, without going full-screen */
  .modal-box-lg { width: 920px; max-width: 100%; max-height: 90vh; }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border-1); flex-shrink: 0;
  }
  .modal-title { font-size: 14px; font-weight: 700; color: var(--text-0); }
  .modal-subtitle { font-size: 11.5px; color: var(--text-6); margin-top: 2px; }
  .modal-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
  .modal-footer {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    padding: 12px 18px; border-top: 1px solid var(--border-1); flex-shrink: 0; background: var(--bg-footer);
  }
  .modal-url-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .modal-url-input {
    flex: 1; background: var(--bg-input); border: 1px solid var(--border-1); border-radius: 6px;
    padding: 8px 10px; color: var(--text-1); font-size: 12.5px;
  }
  .modal-hint { font-size: 11px; color: var(--text-7); margin-bottom: 14px; line-height: 1.5; }
  .modal-status { font-size: 12px; padding: 8px 10px; border-radius: 6px; margin-bottom: 12px; }
  .modal-status.loading { background: var(--bg-sunken); color: var(--text-4); }
  .modal-status.success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
  .modal-status.error { background: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-border); }
  .match-scope-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .match-scope-text { font-size: 11.5px; color: var(--text-5); }
  .match-quick-actions { display: flex; gap: 6px; }
  .match-row {
    display: flex; align-items: center; gap: 10px; padding: 7px 6px;
    border-bottom: 1px solid var(--border-3);
  }
  .match-row:last-child { border-bottom: none; }
  .match-channel-name {
    flex: 1; font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .match-thumb {
    width: 26px; height: 26px; border-radius: 5px; background: var(--border-1); border: 1px solid var(--border-2);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;
  }
  .match-thumb img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
  .hover-preview {
    display: none; position: fixed; z-index: 1000; padding: 8px;
    background: var(--bg-panel); border: 1px solid var(--border-2); border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.55); pointer-events: none;
  }
  .hover-preview.show { display: flex; }
  .hover-preview img {
    display: block; width: 200px; height: 200px; object-fit: contain; border-radius: 6px;
    background-image:
      linear-gradient(45deg, var(--border-1) 25%, transparent 25%), linear-gradient(-45deg, var(--border-1) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--border-1) 75%), linear-gradient(-45deg, transparent 75%, var(--border-1) 75%);
    background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: var(--bg-sunken);
  }
  .match-pick-input {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; color: var(--text-2); width: 190px; flex-shrink: 0;
    background: var(--bg-input); border: 1px solid var(--border-1); border-radius: 5px; padding: 4px 6px;
  }
  .match-pick-input::placeholder { color: var(--text-7); }
  .match-score {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; flex-shrink: 0; width: 44px; text-align: center;
  }
  .match-score.high { background: var(--score-high-bg); color: var(--accent); }
  .match-score.mid { background: var(--warn-bg); color: var(--warn-text); }
  .match-score.none { background: var(--border-1); color: var(--text-7); }
  .match-check { accent-color: var(--accent-strong); flex-shrink: 0; }

  .modal-tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border-1); }
  .modal-tab {
    padding: 8px 4px; margin-bottom: -1px; border: none; background: transparent;
    color: var(--text-6); font-size: 12.5px; font-weight: 600; border-bottom: 2px solid transparent;
  }
  .modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .form-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
  .form-row { display: flex; gap: 10px; }
  .form-field { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .form-field-label { font-size: 10.5px; color: var(--text-7); }
  .form-input {
    background: var(--bg-input); border: 1px solid var(--border-1); border-radius: 6px;
    padding: 8px 10px; color: var(--text-1); font-size: 12.5px; width: 100%;
  }
  .form-check-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-3); margin-top: 2px; }

  .epg-preview { font-size: 10.5px; color: var(--success-text); margin-top: 2px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .epg-preview.dim { color: var(--text-7); }
  .row-epgpick { margin-top: 2px; }

  .rz-toprow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .rz-drop-zone {
    border: 1.5px dashed var(--border-2); border-radius: 12px; padding: 36px 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: var(--text-6); text-align: center; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .rz-drop-zone.dragover { border-color: var(--accent); background: var(--success-bg); color: var(--success-text); }
  .rz-drop-zone-title { font-size: 13px; font-weight: 600; color: var(--text-5); }
  .rz-drop-zone-sub { font-size: 11.5px; }
  .rz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .rz-card { background: var(--bg-input); border: 1px solid var(--border-1); border-radius: 9px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .rz-card-preview {
    aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; position: relative;
    background-image:
      linear-gradient(45deg, var(--border-1) 25%, transparent 25%), linear-gradient(-45deg, var(--border-1) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--border-1) 75%), linear-gradient(-45deg, transparent 75%, var(--border-1) 75%);
    background-size: 14px 14px; background-position: 0 0, 0 7px, 7px -7px, -7px 0px;
    background-color: var(--bg-sunken); display: flex; align-items: center; justify-content: center;
  }
  .rz-card-preview img { max-width: 100%; max-height: 100%; }
  .rz-spin { width: 16px; height: 16px; border-radius: 99px; border: 2px solid var(--border-2); border-top-color: var(--accent); animation: rz-spin 0.8s linear infinite; }
  @keyframes rz-spin { to { transform: rotate(360deg); } }
  .rz-card-name { font-size: 10.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rz-card-meta { font-size: 9.5px; color: var(--text-6); display: flex; justify-content: space-between; }
  .rz-card-meta .down { color: var(--accent); }
  .rz-card-actions { display: flex; gap: 5px; }
  .rz-card-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 5px 0; border-radius: 5px; border: 1px solid var(--border-1); background: var(--bg-footer);
    color: var(--text-3); font-size: 10.5px; font-weight: 600;
  }
  .rz-card-btn.danger { color: var(--danger-icon); flex: 0 0 28px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; border-bottom: 1px solid var(--border-1);
    background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-footer) 100%);
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: var(--score-high-bg); border: 1px solid var(--success-border); color: var(--accent);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-0); }
  .subtitle { font-size: 11px; color: var(--text-6); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .readout {
    display: flex; flex-direction: column; align-items: flex-end;
    padding: 4px 10px; border-right: 1px solid var(--border-1); margin-right: 2px;
  }
  .readout-label { font-size: 9px; letter-spacing: 0.08em; color: var(--text-7); }
  .readout-value { font-size: 15px; color: var(--accent); font-weight: 600; }

  .btn-ghost, .btn-primary, .btn-ghost-small, .btn-danger-small {
    display: flex; align-items: center; gap: 6px; border-radius: 6px;
    font-weight: 600; white-space: nowrap;
  }
  .btn-ghost { padding: 7px 12px; border: 1px solid var(--border-2); background: var(--bg-elevated); color: var(--text-2); font-size: 12.5px; }
  .btn-primary { padding: 7px 14px; border: 1px solid var(--accent-focus); background: var(--accent-strong); color: var(--on-accent-strong); font-size: 12.5px; font-weight: 700; }
  .btn-ghost-small { padding: 6px 10px; border: 1px solid var(--border-2); background: var(--bg-elevated); color: var(--text-3); font-size: 11.5px; gap: 5px; }
  .btn-danger-small { padding: 6px 10px; border: 1px solid var(--error-border); background: var(--error-bg); color: var(--error-text); font-size: 11.5px; gap: 5px; }

  .body { display: flex; flex: 1; min-height: 0; }
  aside {
    width: 220px; flex-shrink: 0; border-right: 1px solid var(--border-1);
    background: var(--bg-footer); padding: 14px 10px; overflow-y: auto;
  }
  .sidebar-label {
    font-size: 10px; letter-spacing: 0.09em; color: var(--text-7);
    padding: 4px 8px; margin-top: 10px; text-transform: uppercase;
  }
  .file-chip {
    display: flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: 6px;
    background: var(--bg-input); border: 1px solid var(--border-1); color: var(--text-4); font-size: 11.5px; margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .group-row {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 8px; border-radius: 6px; border: 1px solid transparent; background: transparent;
    color: var(--text-3); font-size: 12.5px; margin-bottom: 1px; transition: box-shadow 0.1s ease;
  }
  .group-row.active { background: var(--bg-row-active); border: 1px solid var(--success-border); color: var(--row-active-text); }
  .group-row.drag-over-top { box-shadow: inset 0 2px 0 0 var(--accent); }
  .group-row.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .group-drag-handle { color: var(--icon-muted); cursor: grab; flex-shrink: 0; display: flex; }
  .group-drag-handle:active { cursor: grabbing; }
  .group-move-buttons { display: none; flex-shrink: 0; gap: 2px; }
  .group-move-up, .group-move-down {
    display: flex; align-items: center; justify-content: center; color: var(--text-5);
    width: 20px; height: 20px; border-radius: 4px;
  }
  .group-move-up[data-disabled], .group-move-down[data-disabled] { opacity: 0.3; }
  .group-dot { width: 5px; height: 5px; border-radius: 99px; background: var(--accent); flex-shrink: 0; }
  .group-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-count { font-size: 11px; color: var(--text-6); }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border-1); flex-shrink: 0; flex-wrap: wrap; }
  .search-box { display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 6px; background: var(--bg-input); border: 1px solid var(--border-1); width: 280px; }
  .search-box input { background: transparent; border: none; color: var(--text-1); font-size: 12.5px; flex: 1; }
  .selection-count { font-size: 11.5px; color: var(--text-6); margin-right: 4px; }

  .bulk-strip { display: flex; gap: 18px; padding: 9px 16px; border-bottom: 1px solid var(--border-1); background: var(--bg-footer); flex-shrink: 0; flex-wrap: wrap; }
  .bulk-field { display: flex; align-items: center; gap: 6px; }
  .bulk-label { font-size: 10.5px; color: var(--text-7); }
  .bulk-input { background: var(--bg-input); border: 1px solid var(--border-1); border-radius: 5px; padding: 5px 8px; color: var(--text-1); font-size: 11.5px; width: 130px; }

  .list-area { flex: 1; overflow-y: auto; padding: 10px 16px 40px; }
  .group-block { margin-bottom: 10px; }
  .group-header {
    display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
    padding: 7px 6px; background: transparent; border: none; border-bottom: 1px solid var(--border-3);
    color: var(--text-5); font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
  }
  .group-header-name { flex: 1; }
  .group-header-count { font-size: 11px; color: var(--text-7); }
  .rows-wrap { padding-top: 4px; }

  .row { border-radius: 7px; border: 1px solid transparent; margin-bottom: 2px; padding: 2px 6px; transition: box-shadow 0.1s ease; }
  .row.checked { background: var(--success-bg); border: 1px solid var(--success-border); }
  .row.dragging { opacity: 0.35; }
  .row.drag-over-top { box-shadow: inset 0 2px 0 0 var(--accent); }
  .row.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .row-main { display: flex; align-items: center; gap: 9px; padding: 6px 2px; cursor: pointer; }
  .row-main input, .row-main button, .row-main .drag-handle { cursor: auto; }
  .drag-handle { cursor: grab; color: var(--text-7); }
  .drag-handle:active { cursor: grabbing; }
  .group-header { position: relative; }
  .group-header.drag-over { background: var(--bg-row-active); box-shadow: inset 0 0 0 1px var(--success-border); border-radius: 6px; }
  .checkbox { accent-color: var(--accent-strong); }
  .tally-dot { width: 6px; height: 6px; border-radius: 99px; background: var(--border-4); flex-shrink: 0; }
  .tally-dot.on { background: var(--accent); }
  .name-input {
    flex: 1; background: transparent; border: 1px solid transparent; border-radius: 5px;
    padding: 5px 7px; color: var(--text-1); font-size: 12.5px;
  }
  .icon-btn {
    display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border-radius: 5px; border: 1px solid var(--border-1); background: var(--bg-input); color: var(--text-5); flex-shrink: 0;
  }
  .icon-btn.danger { color: var(--danger-icon); }

  .row-details { display: none; flex-wrap: wrap; gap: 14px; padding: 8px 10px 12px 39px; align-items: center; }
  .row.expanded .row-details { display: flex; }
  .detail-field { display: flex; flex-direction: column; gap: 3px; }
  .detail-label { font-size: 9.5px; color: var(--text-7); letter-spacing: 0.04em; }
  .detail-input { background: var(--bg-input); border: 1px solid var(--border-1); border-radius: 5px; padding: 5px 7px; color: var(--text-2); font-size: 11.5px; width: 170px; }
  .url-preview { display: flex; flex-direction: column; gap: 3px; max-width: 360px; }
  .url-text { font-size: 11px; color: var(--text-6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty-state { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 60px 0; color: var(--text-6); }
  .empty-title { font-size: 13px; font-weight: 600; color: var(--text-5); margin-top: 4px; }
  .empty-body { font-size: 12px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-input); border: 1px solid var(--border-2); color: var(--text-1); padding: 9px 16px;
    border-radius: 8px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }

  .sidebar-toggle { display: none; }
  .sidebar-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(4,6,8,0.6); z-index: 95;
  }
  .row-move-buttons { display: none; }

  svg { display: block; }

  /* ---------- mobile layout ---------- */
  @media (max-width: 860px) {
    body { font-size: 13.5px; }

    header { padding: 8px 10px; gap: 8px; flex-wrap: wrap; }
    .sidebar-toggle { display: flex; }
    .subtitle { display: none; }
    .header-right { gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .readout { display: none; }
    .btn-ghost, .btn-primary { padding: 9px 10px; font-size: 12px; }

    .body { position: relative; overflow: hidden; }
    #sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 96;
      width: 82vw; max-width: 320px;
      transform: translateX(-100%); transition: transform 0.2s ease;
      box-shadow: 12px 0 32px rgba(0,0,0,0.5);
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-backdrop.show { display: block; }
    .group-drag-handle { display: none; }
    .group-move-buttons { display: flex; }

    .toolbar { padding: 8px 10px; gap: 6px; }

      "fetch.noChannelsInPlaylist": "Não foram encontrados canais nessa playlist.",
